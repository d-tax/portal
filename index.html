<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Drive Search Portal - D-Tax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services (Googleログイン用) --> 
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* カスタムカーソル（◎の形） */
    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .cursor-dot::after {
      content: "";
      width: 6px;
      height: 6px;
      background-color: #333;
      border-radius: 50%;
    }

    /* カーソルに遅れて追従する虹色のブラー */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 105, 180, 0.6), rgba(135, 206, 250, 0.6), transparent 70%);
      border-radius: 50%;
      filter: blur(30px);
      pointer-events: none;
      z-index: 2;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: left 0.5s ease-out, top 0.5s ease-out, width 0.3s, height 0.3s, opacity 0.3s;
    }

    /* クリック時に広がるリッチな波紋エフェクト */
    .ripple-wave {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 150px;
      background: radial-gradient(
        circle,
        rgba(255, 182, 193, 0.65) 0%,
        rgba(251, 194, 235, 0.6) 25%,
        rgba(161, 140, 209, 0.55) 50%,
        rgba(143, 211, 244, 0.55) 70%,
        transparent 85%
      );
      border-radius: 50%;
      filter: blur(25px);
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      animation: waveAnimation 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes waveAnimation {
      0% { width: 50px; height: 50px; opacity: 0.95; }
      100% { width: 350px; height: 350px; opacity: 0; }
    }

    body { cursor: none; }
    a, button, input { cursor: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-pink-200">

  <!-- カスタムカーソル要素 -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <img src="image/dtaxlogo.png" alt="D-Tax Logo" class="h-9 w-auto object-contain">
      <span class="text-sm font-semibold tracking-tight text-slate-500 border-l pl-3 border-slate-300">Drive Search Portal</span>
    </div>

    <div class="flex items-center space-x-4">
      <div id="auth-section">
        <button id="loginBtn" onclick="handleAuthClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-full font-medium shadow transition transform active:scale-95 text-sm">
          Googleログイン
        </button>
      </div>

      <!-- ハンバーガーメニューボタン -->
      <div class="relative">
        <button onclick="toggleMenu()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex flex-col items-center justify-center space-y-1 transition">
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
        </button>

        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-xl py-2 z-50">
          <div class="px-4 py-2 border-b border-slate-100">
            <p class="text-xs font-medium text-slate-400">メニュー</p>
          </div>
          <a href="https://d-tax.github.io/dtax_freee/" target="_blank" class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
            <span>🔗</span> D-tax freeeポータル
          </a>
          <div id="menuAuthAction" class="border-t border-slate-100 pt-1 mt-1"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-12 flex flex-col justify-center">
    
    <!-- Gemini風ファーストビュー（ログイン前 / 初期画面） -->
    <div id="welcomeView" class="text-center max-w-xl mx-auto py-12 w-full">
      <h2 class="text-4xl font-bold tracking-tight text-slate-900 mb-8">探し物は何ですか？</h2>
      
      <!-- メッセージ入力バー（未ログイン時はクリックでGoogleログインを促す） -->
      <div class="relative shadow-lg rounded-full border border-slate-200 bg-white flex items-center px-6 py-4 transition hover:shadow-xl">
        <span class="text-xl mr-3">✨</span>
        <input type="text" id="initialSearchInput" placeholder="ファイル名や内容についてAIに聞いてみる..." class="w-full bg-transparent focus:outline-none text-slate-700 text-base" onclick="handleInitialInputClick()">
        <button onclick="handleInitialInputClick()" class="ml-2 bg-indigo-600 text-white p-2.5 rounded-full hover:bg-indigo-700 transition shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>
      <p class="text-xs text-slate-400 mt-4">※ 初回は「Googleログイン」によるドライブ連携が必要です</p>
    </div>

    <!-- ログイン後：フィルター機能付きファイル一覧ビュー ＆ 巡回画面 -->
    <div id="portalView" class="hidden space-y-6">
      <!-- 検索・フィルターバー -->
      <div class="relative max-w-2xl mx-auto">
        <input type="text" id="searchInput" placeholder="ファイル名、タグ（#経理など）、説明文で絞り込み..." class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base">
        <svg class="w-6 h-6 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>

      <div class="flex items-center justify-between pt-2 px-1">
        <h3 class="font-bold text-slate-700 text-lg">📁 ドライブファイル巡回一覧</h3>
        <span id="fileCountBadge" class="text-xs bg-slate-200 text-slate-600 px-3 py-1 rounded-full font-medium">0件</span>
      </div>

      <!-- ファイルカード一覧 -->
      <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
  </main>

  <!-- 右下のAIチャットウィジェット（Gemini埋め込み） -->
  <div class="fixed bottom-6 right-6 z-50">
    <div id="chatWindow" class="hidden w-80 sm:w-96 bg-white border border-slate-200 rounded-2xl shadow-2xl flex flex-col h-[480px] mb-4 overflow-hidden transition-all duration-300">
      <div class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between">
        <span class="font-medium text-sm flex items-center gap-2">🤖 ドライブAIアシスタント</span>
        <button onclick="toggleChat()" class="text-white hover:opacity-70 text-sm font-bold">✕</button>
      </div>
      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm bg-slate-50">
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm max-w-[90%]">
          こんにちは！「探し物はなんですか？」右下のチャットや画面中央から、何でも気軽に聞いてくださいね！
        </div>
      </div>
      <div class="p-3 bg-white border-t border-slate-200 flex gap-2">
        <input type="text" id="chatInput" placeholder="AIに質問する..." class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" onkeypress="if(event.key === 'Enter') sendChatMessage()">
        <button onclick="sendChatMessage()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">送信</button>
      </div>
    </div>
    <button onclick="toggleChat()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl transition transform hover:scale-105 active:scale-95">
      💬
    </button>
  </div>

  <script>
    // --- 設定項目 ---
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com'; // Google OAuth クライアントID
    const GEMINI_API_KEY = 'YOUR_GEMINI_API_KEY'; // ★ ご自身のGemini APIキーを設定してください
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

    let tokenClient;
    let accessToken = null;
    let allFiles = [];

    // --- 演出関連（カスタムカーソル等） ---
    const cursorDot = document.getElementById('cursorDot');
    const cursorGlow = document.getElementById('cursorGlow');
    let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      cursorDot.style.opacity = '1'; cursorGlow.style.opacity = '1';
      cursorDot.style.left = `${mouseX}px`; cursorDot.style.top = `${mouseY}px`;
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.15; glowY += (mouseY - glowY) * 0.15;
      cursorGlow.style.left = `${glowX}px`; cursorGlow.style.top = `${glowY}px`;
      requestAnimationFrame(animateGlow);
    }
    animateGlow();

    window.addEventListener('mousedown', (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'ripple-wave';
      ripple.style.left = `${e.clientX}px`; ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
    });

    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('hidden');
    }

    window.onload = function () {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error !== undefined) {
            alert('認証エラーが発生しました');
            return;
          }
          accessToken = resp.access_token;
          onLoginSuccess();
        },
      });
    };

    function handleAuthClick() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    // 未ログイン状態で初期入力欄をクリック・入力されたらログインを促す
    function handleInitialInputClick() {
      if (!accessToken) {
        handleAuthClick();
      }
    }

    function onLoginSuccess() {
      document.getElementById('welcomeView').classList.add('hidden');
      document.getElementById('portalView').classList.remove('hidden');
      document.getElementById('auth-section').innerHTML = '<span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">● ドライブ連携済み</span>';
      
      document.getElementById('menuAuthAction').innerHTML = `
        <button onclick="handleLogout()" class="w-full text-left px-4 py-2.5 text-sm text-rose-600 hover:bg-rose-50 flex items-center gap-2 transition">
          <span>🚪</span> Googleアカウント ログアウト
        </button>
      `;

      fetchDriveFiles();
    }

    function handleLogout() {
      accessToken = null;
      allFiles = [];
      document.getElementById('portalView').classList.add('hidden');
      document.getElementById('welcomeView').classList.remove('hidden');
      document.getElementById('auth-section').innerHTML = `
        <button id="loginBtn" onclick="handleAuthClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-full font-medium shadow transition transform active:scale-95 text-sm">
          Googleログイン
        </button>
      `;
      document.getElementById('menuAuthAction').innerHTML = '';
      toggleMenu();
    }

    // Googleドライブからファイルを巡回取得
    async function fetchDriveFiles() {
      if (!accessToken) return;
      try {
        const response = await fetch('https://www.googleapis.com/drive/v3/files?pageSize=100&fields=files(id,name,webViewLink,iconLink,mimeType,modifiedTime,description)', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await response.json();
        allFiles = data.files || [];
        
        document.getElementById('fileCountBadge').innerText = `${allFiles.length}件`;
        renderFiles(allFiles);

        appendChatMessage('AIアシスタント', `ドライブから ${allFiles.length} 件のファイルを読み込みました！右下のチャットや上のフィルターから自由に探し物を見つけてくださいね。`, false);
      } catch (err) {
        console.error('ファイル取得エラー:', err);
      }
    }

    // ファイルカードのレンダリング
    function renderFiles(files) {
      const listContainer = document.getElementById('fileList');
      if (files.length === 0) {
        listContainer.innerHTML = '<p class="text-slate-400 col-span-2 text-center py-10">該当するファイルが見つかりませんでした。</p>';
        return;
      }

      listContainer.innerHTML = files.map(file => `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between gap-3">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-start gap-3 min-w-0">
              <span class="text-2xl mt-1">📄</span>
              <div class="min-w-0">
                <h3 class="font-medium text-slate-900 truncate" title="${file.name}">${file.name}</h3>
                <p class="text-xs text-slate-400 mt-0.5">更新日: ${new Date(file.modifiedTime).toLocaleDateString()}</p>
              </div>
            </div>
            <a href="${file.webViewLink}" target="_blank" class="shrink-0 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1.5 rounded-xl text-xs font-medium transition">
              開く ↗
            </a>
          </div>
          ${file.description ? `
            <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl text-xs text-slate-600 leading-relaxed truncate" title="${file.description}">
              🏷️ ${escapeHtml(file.description)}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // --- 検索・フィルター機能 ---
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      if (!keyword) {
        renderFiles(allFiles);
        return;
      }
      const filtered = allFiles.filter(f => {
        const nameMatch = f.name && f.name.toLowerCase().includes(keyword);
        const descMatch = f.description && f.description.toLowerCase().includes(keyword);
        return nameMatch || descMatch;
      });
      renderFiles(filtered);
    });

    // --- チャット機能 & Gemini API 連携 ---
    function toggleChat() {
      document.getElementById('chatWindow').classList.toggle('hidden');
    }

    function appendChatMessage(sender, text, isUser = false) {
      const messages = document.getElementById('chatMessages');
      const alignClass = isUser ? 'ml-auto bg-indigo-50 text-indigo-900 border-indigo-100' : 'bg-white text-slate-800 border-slate-200 shadow-sm';
      
      messages.innerHTML += `
        <div class="p-3 rounded-xl border max-w-[90%] ${alignClass}" style="cursor:none;">
          <p class="text-xs font-semibold text-slate-400 mb-1">${sender}</p>
          <div class="leading-relaxed">${text}</div>
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const userText = input.value.trim();
      if (!userText) return;

      if (GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY') {
        alert('コード内の GEMINI_API_KEY にご自身のGemini APIキーを設定してください。');
        return;
      }

      appendChatMessage('あなた', userText, true);
      input.value = '';

      if (allFiles.length === 0) {
        appendChatMessage('AIアシスタント', 'まだGoogleドライブのファイルが読み込まれていません。先に画面上部からログインを完了させてください。', false);
        return;
      }

      const fileSummaryList = allFiles.map((f, i) => 
        `[${i+1}] 名前: ${f.name} | 説明/タグ: ${f.description || 'なし'} | リンク: ${f.webViewLink}`
      ).join('\n');

      const prompt = `あなたはユーザーのGoogleドライブから目的のファイルを探し出す優秀なAIアシスタントです。
以下のユーザーの質問と、ユーザーのドライブ内にあるファイル一覧を基に、該当しそうなファイルを1つまたは複数選んで、親切に回答してください。
回答には必ず該当するファイルのリンク（[ファイル名を開く](URL) の形式など、クリックして開けるように）を含めてください。

【ユーザーの質問】
${userText}

【ドライブ内のファイル一覧】
${fileSummaryList}`;

      const loadingId = 'loading-' + Date.now();
      const messages = document.getElementById('chatMessages');
      messages.innerHTML += `
        <div id="${loadingId}" class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm max-w-[90%] text-slate-400" style="cursor:none;">
          AIがドライブ内を捜索中...
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'post',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        if (data.candidates && data.candidates[0].content) {
          let aiReply = data.candidates[0].content.parts[0].text;
          aiReply = aiReply.replace(/\[([^\]]+)\]\((https:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" class="text-indigo-600 underline font-medium hover:text-indigo-800">$1 ↗</a>');
          appendChatMessage('AIアシスタント', aiReply, false);
        } else {
          appendChatMessage('AIアシスタント', 'すみません、うまく回答を生成できませんでした。もう一度試してみてください。', false);
        }
      } catch (err) {
        document.getElementById(loadingId).remove();
        console.error(err);
        appendChatMessage('AIアシスタント', 'API通信エラーが発生しました。', false);
      }
    }
  </script>
</body>
余白</html>
