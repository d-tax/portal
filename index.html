<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Drive Search Portal - D-Tax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services (Googleログイン用) --> 
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* カスタムカーソル（◎の形） */
    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .cursor-dot::after {
      content: "";
      width: 6px;
      height: 6px;
      background-color: #333;
      border-radius: 50%;
    }

    /* カーソルに遅れて追従する虹色のブラー */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 105, 180, 0.6), rgba(135, 206, 250, 0.6), transparent 70%);
      border-radius: 50%;
      filter: blur(30px);
      pointer-events: none;
      z-index: 2;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: left 0.5s ease-out, top 0.5s ease-out, width 0.3s, height 0.3s, opacity 0.3s;
    }

    /* クリック時に広がるリッチな波紋エフェクト */
    .ripple-wave {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 150px;
      background: radial-gradient(
        circle,
        rgba(255, 182, 193, 0.65) 0%,
        rgba(251, 194, 235, 0.6) 25%,
        rgba(161, 140, 209, 0.55) 50%,
        rgba(143, 211, 244, 0.55) 70%,
        transparent 85%
      );
      border-radius: 50%;
      filter: blur(25px);
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      animation: waveAnimation 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes waveAnimation {
      0% {
        width: 50px;
        height: 50px;
        opacity: 0.95;
      }
      100% {
        width: 350px;
        height: 350px;
        opacity: 0;
      }
    }

    body {
      cursor: none; /* 標準カーソルを非表示にしてカスタムカーソルを適用 */
    }
    a, button, input {
      cursor: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-pink-200">

  <!-- カスタムカーソル要素 -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <!-- アップロードされたD-Taxロゴに置き換え -->
      <img src="image/dtaxlogo.png" alt="D-Tax Logo" class="h-9 w-auto object-contain">
      <span class="text-sm font-semibold tracking-tight text-slate-500 border-l pl-3 border-slate-300">Drive Search Portal</span>
    </div>

    <div class="flex items-center space-x-4">
      <div id="auth-section">
        <button id="loginBtn" onclick="handleAuthClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-full font-medium shadow transition transform active:scale-95 text-sm">
          Googleログイン
        </button>
      </div>

      <!-- ハンバーガーメニューボタン（ログイン後または常時表示） -->
      <div class="relative">
        <button onclick="toggleMenu()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex flex-col items-center justify-center space-y-1 transition">
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
        </button>

        <!-- ドロップダウンメニュー -->
        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-xl py-2 z-50">
          <div class="px-4 py-2 border-b border-slate-100">
            <p class="text-xs font-medium text-slate-400">メニュー</p>
          </div>
          <a href="https://d-tax.github.io/dtax_freee/" target="_blank" class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
            <span>🔗</span> D-tax freeeポータル
          </a>
          <div id="menuAuthAction" class="border-t border-slate-100 pt-1 mt-1">
            <!-- ログアウトボタンはログイン時に動的に表示されます -->
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8">
    <!-- ログイン前案内 -->
    <div id="welcomeView" class="text-center py-20">
      <h2 class="text-3xl font-bold mb-4">Googleドライブのファイルを知的に検索</h2>
      <p class="text-slate-500 mb-8 max-w-lg mx-auto">「Googleログイン」を行って権限を許可すると、ご自身のドライブ内および共有アイテムのファイルを一覧・検索できるようになります。</p>
      <button onclick="handleAuthClick()" class="bg-gradient-to-r from-pink-500 to-indigo-600 text-white px-8 py-3 rounded-full font-medium shadow-lg hover:opacity-90 transition">
        ドライブ連携をはじめる
      </button>
    </div>

    <!-- ログイン後：検索＆ファイル一覧ビュー -->
    <div id="portalView" class="hidden space-y-6">
      <!-- 検索バー -->
      <div class="relative max-w-2xl mx-auto">
        <input type="text" id="searchInput" placeholder="ファイル名やキーワードで検索..." class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg">
        <svg class="w-6 h-6 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>

      <!-- ファイルカード一覧 -->
      <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
        <!-- 動的にJavaScriptで挿入されます -->
      </div>
    </div>
  </main>

  <!-- 右下のAIチャットウィジェット -->
  <div class="fixed bottom-6 right-6 z-50">
    <div id="chatWindow" class="hidden w-80 sm:w-96 bg-white border border-slate-200 rounded-2xl shadow-2xl flex flex-col h-[450px] mb-4 overflow-hidden transition-all duration-300">
      <div class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between">
        <span class="font-medium text-sm flex items-center gap-2">🤖 ドライブAIアシスタント</span>
        <button onclick="toggleChat()" class="text-white hover:opacity-70 text-sm font-bold">✕</button>
      </div>
      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm bg-slate-50">
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm max-w-[85%]">
          こんにちは！ドライブ内のファイルについて何でも聞いてください。「先月の見積書どこだっけ？」などお答えします。
        </div>
      </div>
      <div class="p-3 bg-white border-t border-slate-200 flex gap-2">
        <input type="text" id="chatInput" placeholder="AIに質問する..." class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="sendChatMessage()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">送信</button>
      </div>
    </div>
    <button onclick="toggleChat()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl transition transform hover:scale-105 active:scale-95">
      💬
    </button>
  </div>

  <script>
    // --- 演出関連のスクリプト ---
    const cursorDot = document.getElementById('cursorDot');
    const cursorGlow = document.getElementById('cursorGlow');
    let mouseX = 0, mouseY = 0;
    let glowX = 0, glowY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      cursorDot.style.opacity = '1';
      cursorGlow.style.opacity = '1';
      cursorDot.style.left = `${mouseX}px`;
      cursorDot.style.top = `${mouseY}px`;
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.15;
      glowY += (mouseY - glowY) * 0.15;
      cursorGlow.style.left = `${glowX}px`;
      cursorGlow.style.top = `${glowY}px`;
      requestAnimationFrame(animateGlow);
    }
    animateGlow();

    window.addEventListener('mousedown', (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'ripple-wave';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
    });

    // --- ハンバーガーメニューの開閉 ---
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.classList.toggle('hidden');
    }

    // 画面外クリックでメニューを閉じる
    window.addEventListener('click', (e) => {
      const menu = document.getElementById('dropdownMenu');
      const btn = e.target.closest('button');
      if (!menu.contains(e.target) && (!btn || !btn.onclick?.toString().includes('toggleMenu'))) {
        menu.classList.add('hidden');
      }
    });

    // --- Google API 連携関連 ---
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com'; // ご自身のクライアントIDを設定してください
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

    let tokenClient;
    let accessToken = null;
    let allFiles = [];

    window.onload = function () {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error !== undefined) {
            alert('認証エラーが発生しました');
            return;
          }
          accessToken = resp.access_token;
          onLoginSuccess();
        },
      });
    };

    function handleAuthClick() {
      if (CLIENT_ID.includes('YOUR_GOOGLE_CLIENT_ID')) {
        alert('Google Cloud (GCP) で作成した「クライアントID」をコード内の CLIENT_ID 変数に設定してください。');
        return;
      }
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function onLoginSuccess() {
      document.getElementById('welcomeView').classList.add('hidden');
      document.getElementById('portalView').classList.remove('hidden');
      document.getElementById('auth-section').innerHTML = '<span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">● 連携済み</span>';
      
      // メニュー内にログアウトボタンを追加
      document.getElementById('menuAuthAction').innerHTML = `
        <button onclick="handleLogout()" class="w-full text-left px-4 py-2.5 text-sm text-rose-600 hover:bg-rose-50 flex items-center gap-2 transition">
          <span>🚪</span> Googleアカウント ログアウト
        </button>
      `;

      fetchDriveFiles();
    }

    // ログアウト処理
    function handleLogout() {
      accessToken = null;
      allFiles = [];
      // 画面の状態をリセット
      document.getElementById('portalView').classList.add('hidden');
      document.getElementById('welcomeView').classList.remove('hidden');
      document.getElementById('auth-section').innerHTML = `
        <button id="loginBtn" onclick="handleAuthClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-full font-medium shadow transition transform active:scale-95 text-sm">
          Googleログイン
        </button>
      `;
      document.getElementById('menuAuthAction').innerHTML = '';
      toggleMenu();
    }

    // Googleドライブのファイルをフェッチする
    async function fetchDriveFiles() {
      if (!accessToken) return;
      try {
        const response = await fetch('https://www.googleapis.com/drive/v3/files?pageSize=50&fields=files(id,name,webViewLink,iconLink,mimeType,modifiedTime)', {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        const data = await response.json();
        allFiles = data.files || [];
        renderFiles(allFiles);
      } catch (err) {
        console.error('ファイル取得エラー:', err);
      }
    }

    function renderFiles(files) {
      const listContainer = document.getElementById('fileList');
      if (files.length === 0) {
        listContainer.innerHTML = '<p class="text-slate-400 col-span-2 text-center py-10">ファイルが見つかりませんでした。</p>';
        return;
      }

      listContainer.innerHTML = files.map(file => `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex items-start justify-between gap-3">
          <div class="flex items-start gap-3 min-w-0">
            <span class="text-2xl mt-1">📄</span>
            <div class="min-w-0">
              <h3 class="font-medium text-slate-900 truncate" title="${file.name}">${file.name}</h3>
              <p class="text-xs text-slate-400 mt-1">更新日: ${new Date(file.modifiedTime).toLocaleDateString()}</p>
            </div>
          </div>
          <a href="${file.webViewLink}" target="_blank" class="shrink-0 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-3 py-1.5 rounded-xl text-xs font-medium transition">
            開く ↗
          </a>
        </div>
      `).join('');
    }

    // 検索窓のフィルタリング
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = allFiles.filter(f => f.name.toLowerCase().includes(keyword));
      renderFiles(filtered);
    });

    // チャットウィジェットの開閉
    function toggleChat() {
      const chatWin = document.getElementById('chatWindow');
      chatWin.classList.toggle('hidden');
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const messages = document.getElementById('chatMessages');
      messages.innerHTML += `<div class="bg-indigo-50 text-indigo-900 p-3 rounded-xl border border-indigo-100 ml-auto max-w-[85%]" style="cursor:none;">${text}</div>`;
      input.value = '';

      setTimeout(() => {
        messages.innerHTML += `<div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm max-w-[85%]" style="cursor:none;">「${text}」ですね。ドライブ内のファイルから該当しそうなものを検索中です…</div>`;
        messages.scrollTop = messages.scrollHeight;
      }, 500);
    }
  </script>
</body>
</html>
