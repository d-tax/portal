<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Drive Chat Portal - D-Tax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services (Googleログイン用) --> 
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* カスタムカーソル（◎の形） */
    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .cursor-dot::after {
      content: "";
      width: 6px;
      height: 6px;
      background-color: #333;
      border-radius: 50%;
    }

    /* カーソルに遅れて追従する虹色のブラー */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(255, 105, 180, 0.6), rgba(135, 206, 250, 0.6), transparent 70%);
      border-radius: 50%;
      filter: blur(30px);
      pointer-events: none;
      z-index: 2;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: left 0.5s ease-out, top 0.5s ease-out, width 0.3s, height 0.3s, opacity 0.3s;
    }

    /* クリック時に広がるリッチな波紋エフェクト */
    .ripple-wave {
      position: fixed;
      top: 0;
      left: 0;
      width: 150px;
      height: 150px;
      background: radial-gradient(
        circle,
        rgba(255, 182, 193, 0.65) 0%,
        rgba(251, 194, 235, 0.6) 25%,
        rgba(161, 140, 209, 0.55) 50%,
        rgba(143, 211, 244, 0.55) 70%,
        transparent 85%
      );
      border-radius: 50%;
      filter: blur(25px);
      pointer-events: none;
      z-index: 3;
      transform: translate(-50%, -50%);
      animation: waveAnimation 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes waveAnimation {
      0% { width: 50px; height: 50px; opacity: 0.95; }
      100% { width: 350px; height: 350px; opacity: 0; }
    }

    body { cursor: none; }
    a, button, input { cursor: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-pink-200">

  <!-- カスタムカーソル要素 -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <img src="image/dtaxlogo.png" alt="D-Tax Logo" class="h-9 w-auto object-contain">
      <span class="text-sm font-semibold tracking-tight text-slate-500 border-l pl-3 border-slate-300">Drive AI Chat Portal</span>
    </div>

    <div class="flex items-center space-x-4">
      <div id="auth-section">
        <button id="loginBtn" onclick="handleAuthClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-full font-medium shadow transition transform active:scale-95 text-sm">
          Googleログイン
        </button>
      </div>

      <!-- ハンバーガーメニュー -->
      <div class="relative">
        <button onclick="toggleMenu()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex flex-col items-center justify-center space-y-1 transition">
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="w-5 h-0.5 bg-slate-700 rounded-full"></span>
        </button>

        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-xl py-2 z-50">
          <div class="px-4 py-2 border-b border-slate-100">
            <p class="text-xs font-medium text-slate-400">メニュー</p>
          </div>
          <a href="https://d-tax.github.io/dtax_freee/" target="_blank" class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2 transition">
            <span>🔗</span> D-tax freeeポータル
          </a>
          <div id="menuAuthAction" class="border-t border-slate-100 pt-1 mt-1"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8 flex flex-col justify-center">
    
    <!-- 1. ログイン前：Gemini風ファーストビュー -->
    <div id="welcomeView" class="text-center py-12 w-full">
      <h2 class="text-4xl font-bold tracking-tight text-slate-900 mb-8">探し物は何ですか？</h2>
      
      <div class="relative shadow-lg rounded-full border border-slate-200 bg-white flex items-center px-6 py-4 transition hover:shadow-xl">
        <span class="text-xl mr-3">✨</span>
        <input type="text" id="initialInput" placeholder="フォルダやファイルについてAIに聞いてみる..." class="w-full bg-transparent focus:outline-none text-slate-700 text-base" onkeypress="if(event.key === 'Enter') handleInitialSubmit()">
        <button onclick="handleInitialSubmit()" class="ml-2 bg-indigo-600 text-white p-2.5 rounded-full hover:bg-indigo-700 transition shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </div>
      <p class="text-xs text-slate-400 mt-4">※ 初回は「Googleログイン」によるドライブ連携が必要です</p>
    </div>

    <!-- 2. ログイン後：完全対話型チャット画面 -->
    <div id="chatPortalView" class="hidden flex flex-col h-[75vh] bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden">
      <!-- チャットヘッダーステータス -->
      <div class="bg-slate-50 border-b border-slate-100 px-6 py-3 flex items-center justify-between text-xs text-slate-500">
        <span id="driveStatusText" class="flex items-center gap-2 font-medium text-slate-700">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> ドライブ巡回中 (ファイル・フォルダ読み込み完了)
        </span>
        <button onclick="fetchDriveItems()" class="hover:text-indigo-600 underline transition">再スキャン</button>
      </div>

      <!-- メッセージ履歴エリア -->
      <div id="chatMessages" class="flex-1 p-6 overflow-y-auto space-y-4 text-sm bg-slate-50/50">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm max-w-[85%]">
          <p class="text-xs font-semibold text-indigo-600 mb-1">AIドライブアシスタント</p>
          ドライブの全ファイルとフォルダを読み込みました！「去年のポップアップのフォルダどこだっけ？」「〇〇の資料を探して」など、記憶を頼りに気軽に話しかけてくださいね。
        </div>
      </div>

      <!-- 入力エリア -->
      <div class="p-4 bg-white border-t border-slate-200 flex items-center gap-3">
        <input type="text" id="chatInput" placeholder="例：去年の関西ポップアップの資料どこだっけ？" class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" onkeypress="if(event.key === 'Enter') sendChatMessage()">
        <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl font-medium text-sm shadow transition transform active:scale-95 shrink-0">
          送信
        </button>
      </div>
    </div>

  </main>

  <script>
    // --- 設定項目 ---
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com'; // Google OAuth クライアントID
    const GEMINI_API_KEY = 'AQ.Ab8RN6JZMu5ZQa5PxTDq-cE3l64OZhx2-lptnkCD_4uxXvfYLw'; // ★ ご自身のGemini APIキーを設定してください
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

    let tokenClient;
    let accessToken = null;
    let allDriveItems = []; // ファイルとフォルダの全データ

    // --- 演出関連（カスタムカーソル等） ---
    const cursorDot = document.getElementById('cursorDot');
    const cursorGlow = document.getElementById('cursorGlow');
    let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      cursorDot.style.opacity = '1'; cursorGlow.style.opacity = '1';
      cursorDot.style.left = `${mouseX}px`; cursorDot.style.top = `${mouseY}px`;
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.15; glowY += (mouseY - glowY) * 0.15;
      cursorGlow.style.left = `${glowX}px`; cursorGlow.style.top = `${glowY}px`;
      requestAnimationFrame(animateGlow);
    }
    animateGlow();

    window.addEventListener('mousedown', (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'ripple-wave';
      ripple.style.left = `${e.clientX}px`; ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
    });

    function toggleMenu() {
      document.getElementById('dropdownMenu').classList.toggle('hidden');
    }

    window.onload = function () {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error !== undefined) {
            alert('認証エラーが発生しました');
            return;
          }
          accessToken = resp.access_token;
          onLoginSuccess();
        },
      });
    };

    function handleAuthClick() {
      tokenClient.requestAccessToken({ prompt: 'consent' });
    }

    function handleInitialSubmit() {
      const val = document.getElementById('initialInput').value.trim();
      if (!accessToken) {
        // まだログインしていなければログインを促す
        handleAuthClick();
      } else if (val) {
        // すでにログインしていればチャット画面に移行してその発言を送信
        switchToChatView();
        document.getElementById('chatInput').value = val;
        document.getElementById('initialInput').value = '';
        sendChatMessage();
      }
    }

    function onLoginSuccess() {
      document.getElementById('welcomeView').classList.add('hidden');
      document.getElementById('chatPortalView').classList.remove('hidden');
      document.getElementById('auth-section').innerHTML = '<span class="text-xs font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">● ドライブ連携済み</span>';
      
      document.getElementById('menuAuthAction').innerHTML = `
        <button onclick="handleLogout()" class="w-full text-left px-4 py-2.5 text-sm text-rose-600 hover:bg-rose-50 flex items-center gap-2 transition">
          <span>🚪</span> Googleアカウント ログアウト
        </button>
      `;

      fetchDriveItems();
    }

    function switchToChatView() {
      document.getElementById('welcomeView').classList.add('hidden');
      document.getElementById('chatPortalView').classList.remove('hidden');
    }

    function handleLogout() {
      accessToken = null;
      allDriveItems = [];
      document.getElementById('chatPortalView').classList.add('hidden');
      document.getElementById('welcomeView').classList.remove('hidden');
      document.getElementById('auth-section').innerHTML = `
        <button id="loginBtn" onclick="handleAuthClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-full font-medium shadow transition transform active:scale-95 text-sm">
          Googleログイン
        </button>
      `;
      document.getElementById('menuAuthAction').innerHTML = '';
      toggleMenu();
    }

    // Googleドライブから「フォルダ」と「ファイル」を全件巡回取得する（ページネーション対応）
    async function fetchDriveItems() {
      if (!accessToken) return;
      try {
        let allItems = [];
        let pageToken = null;
        
        do {
          // 1回につき最大100件ずつ、最後までループして取得する
          let url = `https://www.googleapis.com/drive/v3/files?pageSize=100&fields=nextPageToken,files(id,name,webViewLink,mimeType,modifiedTime,description)`;
          if (pageToken) {
            url += `&pageToken=${pageToken}`;
          }
    
          const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${accessToken}` }
          });
          const data = await response.json();
          
          if (data.files) {
            allItems = allItems.concat(data.files);
          }
          pageToken = data.nextPageToken;
          
        } while (pageToken); // 次のページがなくなるまでループ
    
        allDriveItems = allItems;
        
        const folderCount = allDriveItems.filter(f => f.mimeType === 'application/vnd.google-apps.folder').length;
        const fileCount = allDriveItems.length - folderCount;
        
        document.getElementById('driveStatusText').innerHTML = `
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span> ドライブ巡回完了 (フォルダ: ${folderCount}件 / ファイル: ${fileCount}件)
        `;
      } `catch` (err) {
        console.error('アイテム取得エラー:', err);
        document.getElementById('driveStatusText').innerHTML = `
          <span class="w-2 h-2 rounded-full bg-rose-500"></span> ドライブ取得エラー
        `;
      }
    }

    // --- 対話チャット & Gemini API 連携 ---
    function appendChatMessage(sender, text, isUser = false) {
      const messages = document.getElementById('chatMessages');
      const alignClass = isUser ? 'ml-auto bg-indigo-50 text-indigo-900 border-indigo-100' : 'bg-white text-slate-800 border-slate-200 shadow-sm';
      const senderColor = isUser ? 'text-indigo-600' : 'text-slate-400';
      
      messages.innerHTML += `
        <div class="p-4 rounded-2xl border max-w-[85%] ${alignClass}" style="cursor:none;">
          <p class="text-xs font-semibold ${senderColor} mb-1">${sender}</p>
          <div class="leading-relaxed space-y-1">${text}</div>
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const userText = input.value.trim();
      if (!userText) return;

      if (GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY') {
        alert('コード内の GEMINI_API_KEY にご自身のGemini APIキーを設定してください。');
        return;
      }

      appendChatMessage('あなた', userText, true);
      input.value = '';

      if (allDriveItems.length === 0) {
        appendChatMessage('AIドライブアシスタント', 'まだドライブのデータが読み込まれていません。上の「再スキャン」をクリックするか、ログインし直してください。', false);
        return;
      }

      // ドライブ内のファイルとフォルダの一覧をテキスト化してGeminiに渡す
      const itemListText = allDriveItems.map((item, i) => {
        const typeStr = item.mimeType === 'application/vnd.google-apps.folder' ? '【フォルダ】' : '【ファイル】';
        return `[${i+1}] ${typeStr} 名称: ${item.name} | 説明/タグ: ${item.description || 'なし'} | リンク: ${item.webViewLink}`;
      }).join('\n');

      const prompt = `あなたはユーザーのGoogleドライブ（フォルダやファイル）から目的のものを探し出す優秀なAIアシスタントです。
以下のユーザーの質問と、ユーザーのドライブ内にあるフォルダ・ファイルの一覧を基に、該当しそうなフォルダやファイルを1つまたは複数選んで、親切に回答してください。
回答には必ず該当するフォルダやファイルのリンク（[名称を開く](URL) の形式など、クリックしてブラウザで直接開けるように）を含めてください。

【ユーザーの質問】
${userText}

【ドライブ内のアイテム一覧】
${itemListText}`;

      const loadingId = 'loading-' + Date.now();
      const messages = document.getElementById('chatMessages');
      messages.innerHTML += `
        <div id="${loadingId}" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm max-w-[85%] text-slate-400" style="cursor:none;">
          AIがドライブ内のフォルダやファイルを捜索中...
        </div>
      `;
      messages.scrollTop = messages.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'post',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        if (data.candidates && data.candidates[0].content) {
          let aiReply = data.candidates[0].content.parts[0].text;
          // MarkdownのリンクをHTMLのクリック可能なリンクに変換
          aiReply = aiReply.replace(/\[([^\]]+)\]\((https:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" class="text-indigo-600 underline font-medium hover:text-indigo-800">$1 ↗</a>');
          appendChatMessage('AIドライブアシスタント', aiReply, false);
        } else {
          appendChatMessage('AIドライブアシスタント', 'すみません、うまく回答を生成できませんでした。もう一度試してみてください。', false);
        }
      } catch (err) {
        document.getElementById(loadingId).remove();
        console.error(err);
        appendChatMessage('AIドライブアシスタント', 'API通信エラーが発生しました。', false);
      }
    }
  </script>
</body>
</html>
