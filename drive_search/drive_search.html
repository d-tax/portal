<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Soft Drive Map with Gemini</title>
  <style>
    * { box-sizing: border-box; }

    /* 全体背景：オーロラ風グラデーション */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(-45deg, #e0f2fe, #f3e8ff, #fce7f3, #e0e7ff);
      background-size: 400% 400%;
      animation: aurora 25s ease infinite;
    }

    @keyframes aurora {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 1. 最初に表示する Google ログイン誘導モーダル */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 48px 40px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
      width: 90%;
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-card h2 {
      margin: 0 0 12px 0;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-card p {
      margin: 0 0 28px 0;
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
    }

    .btn-google-login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: #ffffff;
      color: #1e293b;
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .btn-google-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      border-color: #cbd5e1;
    }

    .btn-google-login img {
      width: 20px;
      height: 20px;
    }

    /* ヘッダー */
    header {
      position: sticky;
      top: 0;
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      z-index: 1000;
      gap: 20px;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      flex: 1;
      max-width: 550px;
      transition: all 0.3s ease;
    }

    .search-bar:focus-within {
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.15);
      border-color: rgba(168, 85, 247, 0.4);
    }

    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13.5px;
      color: #1e293b;
      width: 100%;
    }

    .btn {
      padding: 8px 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
    }

    /* メインエリア */
    #main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #workspace {
      position: relative;
      flex: 1;
      display: flex;
      overflow: auto;
    }

    #connector-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #tournament-container {
      position: relative;
      z-index: 2;
      display: flex;
      padding: 40px;
      gap: 80px;
      min-height: 100%;
      align-items: flex-start;
    }

    .round-column {
      display: flex;
      flex-direction: column;
      min-width: 220px;
      gap: 16px;
      position: relative;
      align-self: flex-start;
      transition: margin-top 0.2s ease;
    }

    /* Apple風 浮遊感カード UI */
    .node-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }

    .node-card:hover {
      transform: translateY(-3px) scale(1.015);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.03);
      border-color: rgba(255, 255, 255, 1);
    }

    .node-card.selected {
      background: rgba(255, 255, 255, 0.95);
      border: 1.5px solid #6366f1;
      color: #0f172a;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.18);
      transform: translateY(-2px);
    }

    .icon-img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    /* 分岐線のベジェ曲線スタイル */
    .line-default {
      fill: none;
      stroke: rgba(148, 163, 184, 0.45);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .line-active {
      stroke: #6366f1 !important;
      stroke-width: 2.5 !important;
    }

    /* 右側ファイルプレビュー */
    .preview-column {
      width: 520px;
      height: 620px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .preview-header {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.5);
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-header h3 {
      margin: 0;
      font-size: 13.5px;
      color: #1e293b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-body {
      flex: 1;
      background: rgba(241, 245, 249, 0.5);
    }

    .preview-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Google ログイン誘導モーダル -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>✨ Soft Drive Map</h2>
      <p>ファイルブラウザを利用するには<br>Google アカウントでのログインが必要です。</p>
      <button id="modal-login-btn" class="btn-google-login">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google でサインイン
      </button>
    </div>
  </div>

  <header>
    <h1>✨ Soft Drive Map</h1>

    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="選択中フォルダ内をAI検索..." onkeydown="if(event.key==='Enter') executeGeminiSearch()" />
      <button class="btn" style="padding: 5px 14px; font-size: 12px;" onclick="executeGeminiSearch()">AI検索</button>
    </div>

    <div>
      <span id="status" style="font-size: 12px; color: #64748b; font-weight: 500;">ログイン待ち</span>
    </div>
  </header>





















  
  <div id="main-wrapper">
    <div id="workspace">
      <svg id="connector-svg"></svg>
      <div id="tournament-container">

        <!-- 第0ラウンド（起点ドライブ） -->
        <div class="round-column" id="round-0">
          <div class="node-card" onclick="selectDrive('0AFuy2E2OGEvyUk9PVA', '本部管理', this)">
            <img src="image/folder.png" class="icon-img" alt="folder" />
            <span class="title">本部管理</span>
          </div>
          <div class="node-card" onclick="selectDrive('0ALkBF3CxaFy_Uk9PVA', '法人クライアント', this)">
            <img src="image/folder.png" class="icon-img" alt="folder" />
            <span class="title">法人クライアント</span>
          </div>
          <div class="node-card" onclick="selectDrive('0ACErmC2osz2KUk9PVA', '個人クライアント', this)">
            <img src="image/folder.png" class="icon-img" alt="folder" />
            <span class="title">個人クライアント</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com';
    const GEMINI_API_KEY = 'AQ.Ab8RN6JZMu5ZQa5PxTDq-cE3l64OZhx2-lptnkCD_4uxXvfYLw';







    









    

    let accessToken = null;
    let driveDatabase = [];
    let selectedPath = [];

    // Google Identity Services ログイン呼び出し
    document.getElementById('modal-login-btn').addEventListener('click', () => {
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            
            // ログイン完了時にモーダルをふわっと消す
            const overlay = document.getElementById('login-overlay');
            overlay.style.opacity = '0';
            overlay.style.visibility = 'hidden';

            document.getElementById('status').innerText = '準備完了';
          }
        },
      });
      tokenClient.requestAccessToken();
    });

    // ドライブ選択処理
    function selectDrive(driveId, driveName, element) {
      if (!accessToken) {
        document.getElementById('login-overlay').style.opacity = '1';
        document.getElementById('login-overlay').style.visibility = 'visible';
        return;
      }
      handleFolderClick(driveId, driveName, element, 0);
    }

    function handleFolderClick(folderId, folderName, element, roundIndex) {
      const isCurrentlySelected = element.classList.contains('selected');
      const isLastInPath = (roundIndex === selectedPath.length - 1);

      if (isCurrentlySelected && isLastInPath) {
        const driveUrl = (folderId.startsWith('YOUR_') || folderId === 'root')
          ? 'https://drive.google.com/drive/'
          : `https://drive.google.com/drive/folders/${folderId}`;
        window.open(driveUrl, '_blank');
        return;
      }

      selectedPath = selectedPath.slice(0, roundIndex);
      selectedPath.push({ id: folderId, name: folderName, element: element, isFolder: true });

      highlightSelection(element);
      updateSearchPlaceholder();
      loadChildNodes(folderId, roundIndex + 1);
    }

    function handleFileClick(file, element, roundIndex) {
      selectedPath = selectedPath.slice(0, roundIndex);
      selectedPath.push({ id: file.id, name: file.name, element: element, isFolder: false });

      highlightSelection(element);
      clearRoundsFrom(roundIndex + 1);
      renderPreviewColumn(file, roundIndex + 1);
      drawConnectors();
    }

    async function loadChildNodes(parentId, roundIndex) {
      document.getElementById('status').innerText = '読み込み中...';
      clearRoundsFrom(roundIndex);

      try {
        const query = `'${parentId}' in parents and trashed = false`;
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,webViewLink)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=100`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const items = data.files || [];

        renderNextRound(items, roundIndex);
        document.getElementById('status').innerText = `完了 (${items.length}件)`;
        setTimeout(drawConnectors, 50);
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'エラーが発生しました';
      }
    }

    function renderNextRound(items, roundIndex) {
      const container = document.getElementById('tournament-container');
      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = `round-${roundIndex}`;

      if (items.length === 0) {
        column.innerHTML = '<div style="font-size:12px; color:#94a3b8; padding:10px;">(空のフォルダです)</div>';
      } else {
        items.forEach(item => {
          const isFolder = item.mimeType === 'application/vnd.google-apps.folder';
          const card = document.createElement('div');
          card.className = 'node-card';

          const iconSrc = isFolder ? 'image/folder.png' : 'image/file.png';
          card.innerHTML = `
            <img src="${iconSrc}" class="icon-img" alt="icon" />
            <span class="title" title="${item.name}">${item.name}</span>
          `;

          card.addEventListener('click', () => {
            if (isFolder) {
              handleFolderClick(item.id, item.name, card, roundIndex);
            } else {
              handleFileClick(item, card, roundIndex);
            }
          });

          column.appendChild(card);
        });
      }

      container.appendChild(column);
      adjustColumnPosition(roundIndex);
    }

    function renderPreviewColumn(file, roundIndex) {
      const container = document.getElementById('tournament-container');
      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = `round-${roundIndex}`;

      column.innerHTML = `
        <div class="preview-column">
          <div class="preview-header">
            <h3>📄 ${file.name}</h3>
          </div>
          <div class="preview-body">
            <iframe src="https://drive.google.com/file/d/${file.id}/preview"></iframe>
          </div>
        </div>
      `;

      container.appendChild(column);
      adjustColumnPosition(roundIndex);
    }

    function adjustColumnPosition(roundIndex) {
      const parentObj = selectedPath[roundIndex - 1];
      const childCol = document.getElementById(`round-${roundIndex}`);
      if (!parentObj || !childCol) return;

      const parentCard = parentObj.element;
      const parentCenterY = parentCard.offsetTop + (parentCard.offsetHeight / 2);
      const childColHeight = childCol.offsetHeight;

      const targetMarginTop = Math.max(0, parentCenterY - (childColHeight / 2));
      childCol.style.marginTop = `${targetMarginTop}px`;
    }

    // 分岐線のベジェ曲線高精度描画
    function drawConnectors() {
      const svg = document.getElementById('connector-svg');
      const container = document.getElementById('tournament-container');
      if (!svg || !container) return;

      svg.innerHTML = '';

      const containerRect = container.getBoundingClientRect();
      const scrollLeft = container.scrollLeft || 0;
      const scrollTop = container.scrollTop || 0;

      svg.setAttribute('width', container.scrollWidth);
      svg.setAttribute('height', container.scrollHeight);

      for (let i = 0; i < selectedPath.length; i++) {
        const parentObj = selectedPath[i];
        const nextRoundCol = document.getElementById(`round-${i + 1}`);
        if (!parentObj || !nextRoundCol) continue;

        adjustColumnPosition(i + 1);

        const pRect = parentObj.element.getBoundingClientRect();

        const startX = pRect.right - containerRect.left + scrollLeft;
        const startY = pRect.top + (pRect.height / 2) - containerRect.top + scrollTop;

        const childCards = Array.from(nextRoundCol.querySelectorAll('.node-card, .preview-column'));
        if (childCards.length === 0) continue;

        childCards.forEach(child => {
          const cRect = child.getBoundingClientRect();
          const childX = cRect.left - containerRect.left + scrollLeft;
          const childY = cRect.top + (cRect.height / 2) - containerRect.top + scrollTop;

          const isThisChildSelected = (selectedPath[i + 1] && selectedPath[i + 1].element === child);

          const deltaX = childX - startX;
          const controlX1 = startX + deltaX * 0.45;
          const controlX2 = childX - deltaX * 0.45;

          const pathD = `M ${startX} ${startY} C ${controlX1} ${startY}, ${controlX2} ${childY}, ${childX} ${childY}`;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', pathD);
          path.setAttribute('class', `line-default ${isThisChildSelected ? 'line-active' : ''}`);

          svg.appendChild(path);
        });
      }
    }

    // AI/キーワード検索ロジック
    async function executeGeminiSearch() {
      const keyword = document.getElementById('search-input').value.trim();
      const currentFolder = getCurrentSelectedFolder();

      if (!accessToken) {
        alert('Googleでログインしてください');
        return;
      }
      if (!keyword) {
        alert('検索キーワードを入力してください');
        return;
      }

      document.getElementById('status').innerText = 'スキャン中...';

      const targetFolderId = currentFolder ? currentFolder.id : 'root';
      const allFiles = await fetchAllFilesRecursively(targetFolderId);

      if (allFiles.length === 0) {
        alert('検索対象のファイルが見つかりませんでした');
        document.getElementById('status').innerText = '0件';
        return;
      }

      if (GEMINI_API_KEY && GEMINI_API_KEY !== 'YOUR_GEMINI_API_KEY_HERE') {
        document.getElementById('status').innerText = 'Gemini AIで解析中...';
        const searchResults = await searchWithGemini(keyword, allFiles, GEMINI_API_KEY);
        renderSearchResults(searchResults, keyword);
      } else {
        document.getElementById('status').innerText = 'キーワード検索中...';
        const filtered = allFiles.filter(f => f.name.toLowerCase().includes(keyword.toLowerCase()));
        renderSearchResults(filtered, keyword);
      }

      document.getElementById('status').innerText = '検索完了';
    }

    async function fetchAllFilesRecursively(folderId) {
      let fileList = [];
      const query = `'${folderId}' in parents and trashed = false`;

      try {
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=100`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const items = data.files || [];

        for (const item of items) {
          if (item.mimeType === 'application/vnd.google-apps.folder') {
            const subFiles = await fetchAllFilesRecursively(item.id);
            fileList = fileList.concat(subFiles);
          } else {
            fileList.push(item);
          }
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
      return fileList;
    }

    async function searchWithGemini(userQuery, files, apiKey) {
      const fileSummaries = files.map(f => `- ID: ${f.id}, 名前: ${f.name}`).join('\n');

      const prompt = `以下のファイル一覧の中から、ユーザーの検索「${userQuery}」に最も関連するファイルを選び、そのIDのみをカンマ区切りで返してください（例: id1,id2）。該当なしは NONE と返してください。\n\n【ファイル一覧】\n${fileSummaries}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const replyText = data.candidates[0].content.parts[0].text.trim();

        if (replyText.includes('NONE')) return [];

        const matchedIds = replyText.split(',').map(s => s.trim());
        return files.filter(f => matchedIds.includes(f.id));
      } catch (err) {
        console.error('Gemini error:', err);
        return files.filter(f => f.name.toLowerCase().includes(userQuery.toLowerCase()));
      }
    }

    function renderSearchResults(items, keyword) {
      const container = document.getElementById('tournament-container');
      const existingSearchCol = document.getElementById('round-search');
      if (existingSearchCol) existingSearchCol.remove();

      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = 'round-search';

      const header = document.createElement('div');
      header.style.fontSize = '12px';
      header.style.fontWeight = 'bold';
      header.style.color = '#7c3aed';
      header.innerText = `🔍 検索結果: 「${keyword}」 (${items.length}件)`;
      column.appendChild(header);

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <img src="image/file.png" class="icon-img" alt="icon" />
          <span class="title" title="${item.name}">${item.name}</span>
        `;
        card.addEventListener('click', () => {
          highlightSelection(card);
          clearRoundsFrom(1);
          renderPreviewColumn(item, 1);
          drawConnectors();
        });
        column.appendChild(card);
      });

      container.appendChild(column);
      column.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function getCurrentSelectedFolder() {
      for (let i = selectedPath.length - 1; i >= 0; i--) {
        if (selectedPath[i].isFolder) return selectedPath[i];
      }
      return null;
    }

    function updateSearchPlaceholder() {
      const searchInput = document.getElementById('search-input');
      const currentFolder = getCurrentSelectedFolder();
      if (currentFolder) {
        searchInput.placeholder = `「${currentFolder.name}」のフォルダ内をAI検索...`;
      } else {
        searchInput.placeholder = "Google Drive 全体をAI検索...";
      }
    }

    function highlightSelection(element) {
      const parentColumn = element.parentElement;
      Array.from(parentColumn.children).forEach(child => child.classList.remove('selected'));
      element.classList.add('selected');
    }

    function clearRoundsFrom(roundIndex) {
      const container = document.getElementById('tournament-container');
      let i = roundIndex;
      while (document.getElementById(`round-${i}`)) {
        container.removeChild(document.getElementById(`round-${i}`));
        i++;
      }
      const searchCol = document.getElementById('round-search');
      if (searchCol) searchCol.remove();
      drawConnectors();
    }

    window.addEventListener('resize', drawConnectors);
  </script>
</body>
</html>
