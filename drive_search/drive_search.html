<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Soft Tournament Drive Map with Gemini & Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
      color: #4a5568;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 改善点3: ヘッダー（検索バー）を固定（position: sticky） */
    header {
      position: sticky;
      top: 0;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      z-index: 1000;
      gap: 15px;
      flex-wrap: wrap;
    }
    h1 { font-size: 18px; margin: 0; color: #2d3748; font-weight: 600; white-space: nowrap; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      flex: 1;
      max-width: 600px;
    }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: #334155;
      width: 100%;
    }

    .api-key-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .api-key-bar input {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 11px;
    }

    .btn {
      padding: 8px 18px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(124, 58, 237, 0.3); }

    /* 全体レイアウト */
    #main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #workspace {
      position: relative;
      flex: 1;
      display: flex;
      overflow: auto;
    }

    /* SVG接続線描画用キャンバス */
    #connector-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* トーナメント表示エリア */
    #tournament-container {
      position: relative;
      z-index: 2;
      display: flex;
      padding: 40px;
      gap: 80px;
      min-height: 100%;
    }

    /* ラウンド（階層）カラム */
    .round-column {
      display: flex;
      flex-direction: column;
      min-width: 220px;
      gap: 20px;
      position: relative;
      align-self: flex-start; /* 選択フォルダの高さに合わせて個別に移動 */
      transition: margin-top 0.3s ease;
    }

    /* トーナメントカード */
    .node-card {
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(149, 157, 165, 0.08);
      border: 2px solid #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .node-card:hover {
      transform: scale(1.02);
      border-color: #64748b;
    }
    .node-card.selected {
      background: #ffffff;
      border-color: #0f172a;
      border-width: 2px;
      color: #0f172a;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
    }

    .icon-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    /* SVG分岐線 */
    .line-default {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }
    .line-active {
      stroke: #0f172a !important;
      stroke-width: 2.5 !important;
    }

    /* 改善点1: 右側プレビューサイドバー */
    #preview-sidebar {
      width: 0;
      background: #ffffff;
      border-left: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      overflow: hidden;
      box-shadow: -4px 0 15px rgba(0,0,0,0.05);
      z-index: 100;
    }
    #preview-sidebar.open {
      width: 450px;
    }
    .preview-header {
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-header h3 {
      margin: 0;
      font-size: 14px;
      color: #1e293b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #64748b;
    }
    .preview-body {
      flex: 1;
      background: #f1f5f9;
      position: relative;
    }
    .preview-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- 改善点3: スクロールしても固定されるヘッダー -->
  <header>
    <h1>🌸 Drive Map & Gemini Search</h1>

    <div class="search-bar">
      <span>🔍</span>
      <!-- 選択中フォルダに応じて動的にプレースホルダーが切り替わります -->
      <input type="text" id="search-input" placeholder="Google Drive 全体を検索..." onkeydown="if(event.key==='Enter') executeGeminiSearch()" />
      <button class="btn" style="padding: 4px 12px; font-size: 12px;" onclick="executeGeminiSearch()">AI検索</button>
    </div>

    <div class="api-key-bar">
      <span>Gemini Key:</span>
      <input type="password" id="gemini-api-key" placeholder="AI Studio Keyを入力" />
    </div>

    <div>
      <button id="login-btn" class="btn">Googleでログイン</button>
      <span id="status" style="margin-left: 10px; font-size: 12px; color: #718096;"></span>
    </div>
  </header>

  <div id="main-wrapper">
    <div id="workspace">
      <svg id="connector-svg"></svg>

    <div id="tournament-container">
    <!-- 第1ラウンド: 3つの共有フォルダ/ドライブ -->
    <div class="round-column" id="round-0">
      <div class="node-card drive-a" onclick="selectDrive('0AFuy2E2OGEvyUk9PVA', '共有ドライブ A', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">本部管理</span>
      </div>
      <div class="node-card drive-b" onclick="selectDrive('0ALkBF3CxaFy_Uk9PVA', '共有ドライブ B', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">法人クライアント</span>
      </div>
      <div class="node-card drive-c" onclick="selectDrive('0ACErmC2osz2KUk9PVA', '共有ドライブ C', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">個人クライアント</span>
      </div>
    </div>

      
<!-- 右側プレビューパネル -->
    <div id="preview-sidebar">
      <div class="preview-header">
        <h3 id="preview-title">ファイル プレビュー</h3>
        <button class="close-btn" onclick="closePreview()">✕</button>
      </div>
      <div class="preview-body">
        <iframe id="preview-frame" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com';
    let accessToken = null;
    let selectedPath = []; // 選択中のノード配列

    document.getElementById('login-btn').addEventListener('click', () => {
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('status').innerText = '準備完了！フォルダを選択してください';
          }
        },
      });
      tokenClient.requestAccessToken();
    });

    // 共有ドライブ選択処理
    async function selectDrive(driveId, driveName, element) {
      if (!accessToken) { alert('Googleでログインしてください'); return; }
      handleFolderClick(driveId, driveName, element, 0);
    }

    // フォルダクリック時制御（選択中のフォルダを再クリックした場合はDriveを開く）
    function handleFolderClick(folderId, folderName, element, roundIndex) {
      if (element.classList.contains('selected')) {
        const driveUrl = folderId.startsWith('YOUR_') || folderId === 'root'
          ? 'https://drive.google.com/drive/'
          : `https://drive.google.com/drive/folders/${folderId}`;
        window.open(driveUrl, '_blank');
        return;
      }

      selectedPath = selectedPath.slice(0, roundIndex);
      selectedPath.push({ id: folderId, name: folderName, element: element, isFolder: true });

      highlightSelection(element);
      updateSearchPlaceholder();
      loadChildNodes(folderId, roundIndex + 1);
    }

    // ファイルクリック時制御（右側にプレビュー表示）
    function handleFileClick(file, element, roundIndex) {
      selectedPath = selectedPath.slice(0, roundIndex);
      selectedPath.push({ id: file.id, name: file.name, element: element, isFolder: false });

      highlightSelection(element);
      clearRoundsFrom(roundIndex + 1);
      drawConnectors();

      openPreview(file.id, file.name);
    }

    // プレビュー表示関数
    function openPreview(fileId, fileName) {
      const sidebar = document.getElementById('preview-sidebar');
      const frame = document.getElementById('preview-frame');
      const title = document.getElementById('preview-title');

      title.innerText = fileName;
      frame.src = `https://drive.google.com/file/d/${fileId}/preview`;
      sidebar.classList.add('open');
    }

    function closePreview() {
      const sidebar = document.getElementById('preview-sidebar');
      const frame = document.getElementById('preview-frame');
      sidebar.classList.remove('open');
      frame.src = 'about:blank';
    }

    // 選択中のフォルダに応じて検索バーのテキストを書き換え
    function updateSearchPlaceholder() {
      const searchInput = document.getElementById('search-input');
      const currentFolder = getCurrentSelectedFolder();
      if (currentFolder) {
        searchInput.placeholder = `「${currentFolder.name}」のフォルダ内をAI検索...`;
      } else {
        searchInput.placeholder = "Google Drive 全体をAI検索...";
      }
    }

    function getCurrentSelectedFolder() {
      for (let i = selectedPath.length - 1; i >= 0; i--) {
        if (selectedPath[i].isFolder) return selectedPath[i];
      }
      return null;
    }

    // 子ノード読み込み
    async function loadChildNodes(parentId, roundIndex) {
      document.getElementById('status').innerText = '読み込み中...';
      clearRoundsFrom(roundIndex);

      try {
        const query = `'${parentId}' in parents and trashed = false`;
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,webViewLink)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=50`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const items = data.files || [];

        renderNextRound(items, roundIndex);
        document.getElementById('status').innerText = `完了 (${items.length} 件)`;
        
        setTimeout(drawConnectors, 50);
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = '読み込みエラー';
      }
    }

    function renderNextRound(items, roundIndex) {
      const container = document.getElementById('tournament-container');
      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = `round-${roundIndex}`;

      if (items.length === 0) {
        column.innerHTML = '<div style="font-size:12px; color:#a0aec0; padding:10px;">(空です)</div>';
      } else {
        items.forEach(item => {
          const isFolder = item.mimeType === 'application/vnd.google-apps.folder';
          const card = document.createElement('div');
          card.className = 'node-card';
          
          const iconSrc = isFolder ? 'image/folder.png' : 'image/file.png';
          card.innerHTML = `
            <img src="${iconSrc}" class="icon-img" alt="icon" />
            <span class="title" title="${item.name}">${item.name}</span>
          `;

          card.addEventListener('click', () => {
            if (isFolder) {
              handleFolderClick(item.id, item.name, card, roundIndex);
            } else {
              handleFileClick(item, card, roundIndex);
            }
          });

          column.appendChild(card);
        });
      }

      container.appendChild(column);
      adjustColumnPosition(roundIndex);
    }

    // 選択フォルダの位置を中心軸にして配下カラムを上下中央揃え配置
    function adjustColumnPosition(roundIndex) {
      const parentObj = selectedPath[roundIndex - 1];
      const childCol = document.getElementById(`round-${roundIndex}`);
      if (!parentObj || !childCol) return;

      const workspace = document.getElementById('workspace');
      const wRect = workspace.getBoundingClientRect();
      const pRect = parentObj.element.getBoundingClientRect();

      const parentCenterY = pRect.top + pRect.height / 2 - wRect.top + workspace.scrollTop;
      const childColHeight = childCol.offsetHeight;

      const targetMarginTop = Math.max(0, parentCenterY - childColHeight / 2);
      childCol.style.marginTop = `${targetMarginTop}px`;
    }

    // SVG分岐線の描画
    function drawConnectors() {
      const svg = document.getElementById('connector-svg');
      const workspace = document.getElementById('workspace');
      svg.innerHTML = '';

      svg.setAttribute('width', workspace.scrollWidth);
      svg.setAttribute('height', workspace.scrollHeight);

      for (let i = 0; i < selectedPath.length; i++) {
        const parentObj = selectedPath[i];
        const nextRoundCol = document.getElementById(`round-${i + 1}`);
        if (!parentObj || !nextRoundCol) continue;

        adjustColumnPosition(i + 1);

        const pRect = parentObj.element.getBoundingClientRect();
        const wRect = workspace.getBoundingClientRect();

        const startX = pRect.right - wRect.left + workspace.scrollLeft;
        const startY = pRect.top + pRect.height / 2 - wRect.top + workspace.scrollTop;

        const childCards = Array.from(nextRoundCol.querySelectorAll('.node-card'));
        if (childCards.length === 0) continue;

        const childYs = childCards.map(c => {
          const cr = c.getBoundingClientRect();
          return cr.top + cr.height / 2 - wRect.top + workspace.scrollTop;
        });

        const minChildY = Math.min(...childYs, startY);
        const maxChildY = Math.max(...childYs, startY);

        const firstChildRect = childCards[0].getBoundingClientRect();
        const firstChildX = firstChildRect.left - wRect.left + workspace.scrollLeft;
        const midX = startX + (firstChildX - startX) / 2;

        const isNextSelected = selectedPath[i + 1];

        // 横線（親から幹）
        const parentLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        parentLine.setAttribute('x1', startX); parentLine.setAttribute('y1', startY);
        parentLine.setAttribute('x2', midX);   parentLine.setAttribute('y2', startY);
        parentLine.setAttribute('class', `line-default ${isNextSelected ? 'line-active' : ''}`);
        svg.appendChild(parentLine);

        // 縦幹
        const verticalLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        verticalLine.setAttribute('x1', midX); verticalLine.setAttribute('y1', minChildY);
        verticalLine.setAttribute('x2', midX); verticalLine.setAttribute('y2', maxChildY);
        verticalLine.setAttribute('class', 'line-default');
        svg.appendChild(verticalLine);

        // 横線（幹から子）
        childCards.forEach(child => {
          const cRect = child.getBoundingClientRect();
          const childX = cRect.left - wRect.left + workspace.scrollLeft;
          const childY = cRect.top + cRect.height / 2 - wRect.top + workspace.scrollTop;

          const childLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          childLine.setAttribute('x1', midX);   childLine.setAttribute('y1', childY);
          childLine.setAttribute('x2', childX); childLine.setAttribute('y2', childY);

          const isThisChildSelected = (selectedPath[i + 1] && selectedPath[i + 1].element === child);
          childLine.setAttribute('class', `line-default ${isThisChildSelected ? 'line-active' : ''}`);
          svg.appendChild(childLine);

          if (isThisChildSelected) {
            const activeVert = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            activeVert.setAttribute('x1', midX); activeVert.setAttribute('y1', startY);
            activeVert.setAttribute('x2', midX); activeVert.setAttribute('y2', childY);
            activeVert.setAttribute('class', 'line-default line-active');
            svg.appendChild(activeVert);
          }
        });
      }
    }

    // AI検索処理
    async function executeGeminiSearch() {
      const keyword = document.getElementById('search-input').value.trim();
      const apiKey = document.getElementById('gemini-api-key').value.trim();
      const currentFolder = getCurrentSelectedFolder();

      if (!accessToken) { alert('Googleでログインしてください'); return; }
      if (!keyword) { alert('検索キーワードを入力してください'); return; }

      document.getElementById('status').innerText = '階層配下をスキャン中...';

      const targetFolderId = currentFolder ? currentFolder.id : 'root';
      const allFiles = await fetchAllFilesRecursively(targetFolderId);

      if (allFiles.length === 0) {
        alert('検索対象のファイルが見つかりませんでした');
        document.getElementById('status').innerText = 'ファイルなし';
        return;
      }

      if (apiKey) {
        document.getElementById('status').innerText = 'Gemini AIで解析中...';
        const searchResults = await searchWithGemini(keyword, allFiles, apiKey);
        renderSearchResults(searchResults, keyword);
      } else {
        document.getElementById('status').innerText = 'ローカル検索中...';
        const filtered = allFiles.filter(f => 
          f.name.toLowerCase().includes(keyword.toLowerCase()) || 
          (f.description && f.description.toLowerCase().includes(keyword.toLowerCase()))
        );
        renderSearchResults(filtered, keyword);
      }

      document.getElementById('status').innerText = '検索完了';
    }

    async function fetchAllFilesRecursively(folderId) {
      let fileList = [];
      const query = `'${folderId}' in parents and trashed = false`;

      try {
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,description,webViewLink)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=100`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const items = data.files || [];

        for (const item of items) {
          if (item.mimeType === 'application/vnd.google-apps.folder') {
            const subFiles = await fetchAllFilesRecursively(item.id);
            fileList = fileList.concat(subFiles);
          } else {
            fileList.push(item);
          }
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
      return fileList;
    }

    async function searchWithGemini(userQuery, files, apiKey) {
      const fileSummaries = files.map(f => `- ID: ${f.id}, 名前: ${f.name}, 説明: ${f.description || 'なし'}`).join('\n');

      const prompt = `あなたはファイル探索アシスタントです。
以下のGoogle Driveのファイル一覧の中から、ユーザーの検索意図「${userQuery}」に最も関連性の高いファイルを選び出してください。

【ファイル一覧】
${fileSummaries}

回答はヒットしたファイルのIDのみをカンマ区切り（例: id1,id2,id3）で返してください。関連するものがない場合は "NONE" とだけ返してください。`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const replyText = data.candidates[0].content.parts[0].text.trim();

        if (replyText.includes('NONE')) return [];

        const matchedIds = replyText.split(',').map(s => s.trim());
        return files.filter(f => matchedIds.includes(f.id));
      } catch (err) {
        console.error('Gemini API Error:', err);
        alert('Gemini APIの呼び出しに失敗しました。キーを確認してください。');
        return files.filter(f => f.name.includes(userQuery));
      }
    }

    function renderSearchResults(items, keyword) {
      const container = document.getElementById('tournament-container');
      const existingSearchCol = document.getElementById('round-search');
      if (existingSearchCol) existingSearchCol.remove();

      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = 'round-search';

      const header = document.createElement('div');
      header.style.fontSize = '12px';
      header.style.fontWeight = 'bold';
      header.style.color = '#7c3aed';
      header.innerText = `🔍 AI検索結果: 「${keyword}」 (${items.length}件)`;
      column.appendChild(header);

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <img src="image/file.png" class="icon-img" alt="icon" />
          <span class="title" title="${item.name}">${item.name}</span>
        `;
        card.addEventListener('click', () => {
          highlightSelection(card);
          openPreview(item.id, item.name);
        });
        column.appendChild(card);
      });

      container.appendChild(column);
      column.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function highlightSelection(element) {
      const parentColumn = element.parentElement;
      Array.from(parentColumn.children).forEach(child => child.classList.remove('selected'));
      element.classList.add('selected');
    }

    function clearRoundsFrom(roundIndex) {
      const container = document.getElementById('tournament-container');
      let i = roundIndex;
      while (document.getElementById(`round-${i}`)) {
        container.removeChild(document.getElementById(`round-${i}`));
        i++;
      }
      const searchCol = document.getElementById('round-search');
      if (searchCol) searchCol.remove();
      drawConnectors();
    }

    window.addEventListener('resize', drawConnectors);
