<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Drive Column Browser</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e1e;
      color: #ccc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background-color: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    button {
      padding: 6px 14px;
      background-color: #0e639c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { background-color: #555; cursor: not-allowed; }

    /* Macファインダー風 カラムコンテナ */
    #columns-container {
      flex: 1;
      display: flex;
      overflow-x: auto;
      background-color: #1e1e1e;
    }
    .column {
      min-width: 240px;
      width: 240px;
      border-right: 1px solid #3c3c3c;
      overflow-y: auto;
      background-color: #252526;
      flex-shrink: 0;
    }
    .item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
      border-bottom: 1px solid #2d2d2d;
    }
    .item:hover { background-color: #2a2d2e; }
    .item.selected { background-color: #094771; color: white; }
    .item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }
    .arrow { font-size: 10px; color: #888; }
    .item.selected .arrow { color: white; }

    /* プレビュー・詳細エリア */
    .preview-panel {
      min-width: 280px;
      padding: 20px;
      background-color: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }
    .preview-title { font-weight: bold; font-size: 16px; word-break: break-all; color: #fff; }
    .open-link {
      display: inline-block;
      margin-top: 10px;
      color: #3794ff;
      text-decoration: none;
    }
  </style>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header>
    <h3 style="margin:0; font-size:16px;">Drive Column Browser</h3>
    <div>
      <button id="login-btn">Googleでログイン</button>
      <span id="status" style="margin-left: 10px; font-size: 12px;"></span>
    </div>
  </header>

  <div id="columns-container">
    <!-- カラムがここに動的追加されます -->
  </div>

  <script>
    // ★ Step 1で取得した CLIENT_ID を貼り付けてください
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com';

    let accessToken = null;
    let columnsData = []; // 各カラムの情報を保持

    document.getElementById('login-btn').addEventListener('click', () => {
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.metadata.readonly',
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('status').innerText = '接続成功';
            // ルートフォルダ（マイドライブ）から読み込み開始
            loadColumn('root', 0);
          }
        },
      });
      tokenClient.requestAccessToken();
    });

    // 指定フォルダ直下のファイル/フォルダを取得してカラムに追加
    async function loadColumn(folderId, columnIndex) {
      document.getElementById('status').innerText = '読み込み中...';
      
      // 指定した深度より右側のカラムを削除
      columnsData = columnsData.slice(0, columnIndex);
      renderColumns();

      try {
        const query = `'${folderId}' in parents and trashed = false`;
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,size,modifiedTime,webViewLink)&pageSize=100&orderBy=folder,name`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const files = data.files || [];

        columnsData[columnIndex] = { folderId, files, selectedId: null };
        renderColumns();
        document.getElementById('status').innerText = '';
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = '取得エラー';
      }
    }

    // カラム群を描画
    function renderColumns() {
      const container = document.getElementById('columns-container');
      container.innerHTML = '';

      columnsData.forEach((col, colIdx) => {
        const colEl = document.createElement('div');
        colEl.className = 'column';

        col.files.forEach(file => {
          const isFolder = file.mimeType === 'application/vnd.google-apps.folder';
          const itemEl = document.createElement('div');
          itemEl.className = `item ${col.selectedId === file.id ? 'selected' : ''}`;
          
          itemEl.innerHTML = `
            <span class="item-name">${isFolder ? '📁' : '📄'} ${file.name}</span>
            ${isFolder ? '<span class="arrow">▶</span>' : ''}
          `;

          itemEl.addEventListener('click', () => {
            col.selectedId = file.id;
            if (isFolder) {
              loadColumn(file.id, colIdx + 1);
            } else {
              // ファイルの場合はプレビューを表示
              showPreview(file, colIdx + 1);
            }
            renderColumns();
          });

          colEl.appendChild(itemEl);
        });

        container.appendChild(colEl);
      });
    }

    // 最右カラムにファイル詳細を表示
    function showPreview(file, columnIndex) {
      columnsData = columnsData.slice(0, columnIndex);
      
      const container = document.getElementById('columns-container');
      renderColumns();

      const previewEl = document.createElement('div');
      previewEl.className = 'preview-panel';
      previewEl.innerHTML = `
        <div class="preview-title">${file.name}</div>
        <div><strong>更新日:</strong> ${new Date(file.modifiedTime).toLocaleString()}</div>
        ${file.size ? `<div><strong>サイズ:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB</div>` : ''}
        <a class="open-link" href="${file.webViewLink}" target="_blank">Google Driveで開く ↗</a>
      `;
      container.appendChild(previewEl);
    }
  </script>
</body>
</html>
