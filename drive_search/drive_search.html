

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Soft Drive Map with Gemini</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
      color: #4a5568;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. スクロール固定ヘッダー */
    header {
      position: sticky;
      top: 0;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      z-index: 1000;
      gap: 15px;
    }
    h1 { font-size: 18px; margin: 0; color: #2d3748; font-weight: 600; white-space: nowrap; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      flex: 1;
      max-width: 500px;
    }
    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: #334155;
      width: 100%;
    }

    .btn {
      padding: 8px 18px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(124, 58, 237, 0.3); }

    /* メインエリア */
    #main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #workspace {
      position: relative;
      flex: 1;
      display: flex;
      overflow: auto;
    }

    /* SVG接続線キャンバス */
    #connector-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* トーナメント表示エリア */
    #tournament-container {
      position: relative;
      z-index: 2;
      display: flex;
      padding: 40px;
      gap: 80px;
      min-height: 100%;
      align-items: flex-start;
    }

    /* 階層カラム */
    .round-column {
      display: flex;
      flex-direction: column;
      min-width: 220px;
      gap: 16px;
      position: relative;
      align-self: flex-start;
      transition: margin-top 0.2s ease;
    }

    /* ノードカード */
    .node-card {
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(149, 157, 165, 0.08);
      border: 2px solid #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }
    .node-card:hover {
      transform: scale(1.02);
      border-color: #64748b;
    }
    .node-card.selected {
      background: #ffffff;
      border-color: #0f172a;
      border-width: 2px;
      color: #0f172a;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
    }

    /* ドライブ色付け */
    .node-card.drive-a { border-left: 6px solid #f472b6; }
    .node-card.drive-b { border-left: 6px solid #38bdf8; }
    .node-card.drive-c { border-left: 6px solid #34d399; }

    .icon-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    /* SVG線スタイル */
    .line-default {
      fill: none;
      stroke: #cbd5e1;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: stroke 0.2s ease;
    }
    .line-active {
      stroke: #0f172a !important;
      stroke-width: 2.5 !important;
    }

    /* 2. 右側インラインファイルプレビュー */
    .preview-column {
      width: 500px;
      height: 600px;
      background: #ffffff;
      border-radius: 12px;
      border: 2px solid #0f172a;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .preview-header {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-header h3 {
      margin: 0;
      font-size: 13px;
      color: #0f172a;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-body {
      flex: 1;
      background: #f1f5f9;
    }
    .preview-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header>
    <h1>🌸 Soft Drive Map</h1>

    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="選択中フォルダ内をAI検索..." onkeydown="if(event.key==='Enter') executeGeminiSearch()" />
      <button class="btn" style="padding: 4px 12px; font-size: 12px;" onclick="executeGeminiSearch()">AI検索</button>
    </div>

    <div>
      <button id="login-btn" class="btn">Googleでログイン</button>
      <span id="status" style="margin-left: 10px; font-size: 12px; color: #718096;"></span>
    </div>
  </header>

  <div id="main-wrapper">
    <div id="workspace">
      <svg id="connector-svg"></svg>
      <div id="tournament-container">




        

        
    <!-- 第1ラウンド: 3つの共有フォルダ/ドライブ -->
    <div class="round-column" id="round-0">
      <div class="node-card drive-a" onclick="selectDrive('0AFuy2E2OGEvyUk9PVA', '共有ドライブ A', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">本部管理</span>
      </div>
      <div class="node-card drive-b" onclick="selectDrive('0ALkBF3CxaFy_Uk9PVA', '共有ドライブ B', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">法人クライアント</span>
      </div>
      <div class="node-card drive-c" onclick="selectDrive('0ACErmC2osz2KUk9PVA', '共有ドライブ C', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">個人クライアント</span>
      </div>
    </div>

<!-- 554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com -->
<!-- gemini api : AQ.Ab8RN6JZMu5ZQa5PxTDq-cE3l64OZhx2-lptnkCD_4uxXvfYLw -->


        




        <script>
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com';
    // 3. Gemini API Keyをコード内に設定
    const GEMINI_API_KEY = 'AQ.Ab8RN6JZMu5ZQa5PxTDq-cE3l64OZhx2-lptnkCD_4uxXvfYLw';

    let accessToken = null;
    let selectedPath = []; // 選択パス管理

    document.getElementById('login-btn').addEventListener('click', () => {
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('status').innerText = '準備完了';
          }
        },
      });
      tokenClient.requestAccessToken();
    });

    function selectDrive(driveId, driveName, element) {
      if (!accessToken) { alert('Googleでログインしてください'); return; }
      handleFolderClick(driveId, driveName, element, 0);
    }

    // 4. フォルダクリック処理（最終選択中の場合のみGoogle Driveへ飛ぶ）
    function handleFolderClick(folderId, folderName, element, roundIndex) {
      const isCurrentlySelected = element.classList.contains('selected');
      const isLastInPath = (roundIndex === selectedPath.length - 1);

      // 最終選択のフォルダを再度クリックした場合のみGoogle Driveを開く
      if (isCurrentlySelected && isLastInPath) {
        const driveUrl = (folderId.startsWith('YOUR_') || folderId === 'root')
          ? 'https://drive.google.com/drive/'
          : `https://drive.google.com/drive/folders/${folderId}`;
        window.open(driveUrl, '_blank');
        return;
      }

      // パスの切捨て更新（途中の階層をクリックした場合はそこまでのパスにする）
      selectedPath = selectedPath.slice(0, roundIndex);
      selectedPath.push({ id: folderId, name: folderName, element: element, isFolder: true });

      highlightSelection(element);
      updateSearchPlaceholder();
      loadChildNodes(folderId, roundIndex + 1);
    }

    // 1. ファイルクリック処理（ファイルの右隣にプレビュー表示）
    function handleFileClick(file, element, roundIndex) {
      selectedPath = selectedPath.slice(0, roundIndex);
      selectedPath.push({ id: file.id, name: file.name, element: element, isFolder: false });

      highlightSelection(element);
      clearRoundsFrom(roundIndex + 1);
      
      // 右隣にプレビュー列を生成
      renderPreviewColumn(file, roundIndex + 1);
      drawConnectors();
    }

    // 右隣へのプレビューカラム描画
    function renderPreviewColumn(file, roundIndex) {
      const container = document.getElementById('tournament-container');
      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = `round-${roundIndex}`;

      column.innerHTML = `
        <div class="preview-column">
          <div class="preview-header">
            <h3>📄 ${file.name}</h3>
          </div>
          <div class="preview-body">
            <iframe src="https://drive.google.com/file/d/${file.id}/preview"></iframe>
          </div>
        </div>
      `;

      container.appendChild(column);
      adjustColumnPosition(roundIndex);
    }

    function updateSearchPlaceholder() {
      const searchInput = document.getElementById('search-input');
      const currentFolder = getCurrentSelectedFolder();
      if (currentFolder) {
        searchInput.placeholder = `「${currentFolder.name}」のフォルダ内をAI検索...`;
      } else {
        searchInput.placeholder = "Google Drive 全体をAI検索...";
      }
    }

    function getCurrentSelectedFolder() {
      for (let i = selectedPath.length - 1; i >= 0; i--) {
        if (selectedPath[i].isFolder) return selectedPath[i];
      }
      return null;
    }

    // 子要素読み込み
    async function loadChildNodes(parentId, roundIndex) {
      document.getElementById('status').innerText = '読み込み中...';
      clearRoundsFrom(roundIndex);

      try {
        const query = `'${parentId}' in parents and trashed = false`;
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,webViewLink)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=100`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const items = data.files || [];

        renderNextRound(items, roundIndex);
        document.getElementById('status').innerText = `完了 (${items.length}件)`;
        setTimeout(drawConnectors, 50);
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'エラー';
      }
    }

    function renderNextRound(items, roundIndex) {
      const container = document.getElementById('tournament-container');
      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = `round-${roundIndex}`;

      if (items.length === 0) {
        column.innerHTML = '<div style="font-size:12px; color:#a0aec0; padding:10px;">(空です)</div>';
      } else {
        items.forEach(item => {
          const isFolder = item.mimeType === 'application/vnd.google-apps.folder';
          const card = document.createElement('div');
          card.className = 'node-card';
          
          const iconSrc = isFolder ? 'image/folder.png' : 'image/file.png';
          card.innerHTML = `
            <img src="${iconSrc}" class="icon-img" alt="icon" />
            <span class="title" title="${item.name}">${item.name}</span>
          `;

          card.addEventListener('click', () => {
            if (isFolder) {
              handleFolderClick(item.id, item.name, card, roundIndex);
            } else {
              handleFileClick(item, card, roundIndex);
            }
          });

          column.appendChild(card);
        });
      }

      container.appendChild(column);
      adjustColumnPosition(roundIndex);
    }

    // カラムの上下位置調整
    function adjustColumnPosition(roundIndex) {
      const parentObj = selectedPath[roundIndex - 1];
      const childCol = document.getElementById(`round-${roundIndex}`);
      if (!parentObj || !childCol) return;

      const parentCard = parentObj.element;
      const parentCol = parentCard.parentElement;

      // 選択した親カードの相対Y位置に子のカラムの中心を合わせる
      const parentCenterY = parentCard.offsetTop + (parentCard.offsetHeight / 2);
      const childColHeight = childCol.offsetHeight;

      const targetMarginTop = Math.max(0, parentCenterY - (childColHeight / 2));
      childCol.style.marginTop = `${targetMarginTop}px`;
    }

    // 2. SVG分岐線の描画位置計算修正
    function drawConnectors() {
      const svg = document.getElementById('connector-svg');
      const container = document.getElementById('tournament-container');
      svg.innerHTML = '';

      const containerRect = container.getBoundingClientRect();
      svg.setAttribute('width', container.scrollWidth + 100);
      svg.setAttribute('height', container.scrollHeight + 100);

      for (let i = 0; i < selectedPath.length; i++) {
        const parentObj = selectedPath[i];
        const nextRoundCol = document.getElementById(`round-${i + 1}`);
        if (!parentObj || !nextRoundCol) continue;

        adjustColumnPosition(i + 1);

        const pRect = parentObj.element.getBoundingClientRect();
        
        // コンテナ相対座標に変換
        const startX = pRect.right - containerRect.left;
        const startY = pRect.top + pRect.height / 2 - containerRect.top;

        const childCards = Array.from(nextRoundCol.querySelectorAll('.node-card, .preview-column'));
        if (childCards.length === 0) continue;

        const childYs = childCards.map(c => {
          const cr = c.getBoundingClientRect();
          return cr.top + cr.height / 2 - containerRect.top;
        });

        const minChildY = Math.min(...childYs, startY);
        const maxChildY = Math.max(...childYs, startY);

        const firstChildRect = childCards[0].getBoundingClientRect();
        const firstChildX = firstChildRect.left - containerRect.left;
        const midX = startX + (firstChildX - startX) / 2;

        const isNextSelected = selectedPath[i + 1];

        // 親から幹への横線
        createSvgLine(svg, startX, startY, midX, startY, `line-default ${isNextSelected ? 'line-active' : ''}`);

        // 縦幹線
        createSvgLine(svg, midX, minChildY, midX, maxChildY, 'line-default');

        // 幹から各子要素への横線
        childCards.forEach(child => {
          const cRect = child.getBoundingClientRect();
          const childX = cRect.left - containerRect.left;
          const childY = cRect.top + cRect.height / 2 - containerRect.top;

          const isThisChildSelected = (selectedPath[i + 1] && selectedPath[i + 1].element === child);
          createSvgLine(svg, midX, childY, childX, childY, `line-default ${isThisChildSelected ? 'line-active' : ''}`);

          if (isThisChildSelected) {
            createSvgLine(svg, midX, startY, midX, childY, 'line-default line-active');
          }
        });
      }
    }

    function createSvgLine(svg, x1, y1, x2, y2, className) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('class', className);
      svg.appendChild(line);
    }

    // Gemini API 検索
    async function executeGeminiSearch() {
      const keyword = document.getElementById('search-input').value.trim();
      const currentFolder = getCurrentSelectedFolder();

      if (!accessToken) { alert('Googleでログインしてください'); return; }
      if (!keyword) { alert('検索キーワードを入力してください'); return; }

      document.getElementById('status').innerText = 'スキャン中...';

      const targetFolderId = currentFolder ? currentFolder.id : 'root';
      const allFiles = await fetchAllFilesRecursively(targetFolderId);

      if (allFiles.length === 0) {
        alert('検索対象ファイルが見つかりませんでした');
        document.getElementById('status').innerText = '0件';
        return;
      }

      if (GEMINI_API_KEY && GEMINI_API_KEY !== 'YOUR_GEMINI_API_KEY_HERE') {
        document.getElementById('status').innerText = 'Gemini AIで解析中...';
        const searchResults = await searchWithGemini(keyword, allFiles, GEMINI_API_KEY);
        renderSearchResults(searchResults, keyword);
      } else {
        document.getElementById('status').innerText = 'キーワード検索中...';
        const filtered = allFiles.filter(f => f.name.toLowerCase().includes(keyword.toLowerCase()));
        renderSearchResults(filtered, keyword);
      }

      document.getElementById('status').innerText = '検索完了';
    }

    async function fetchAllFilesRecursively(folderId) {
      let fileList = [];
      const query = `'${folderId}' in parents and trashed = false`;

      try {
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=100`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const items = data.files || [];

        for (const item of items) {
          if (item.mimeType === 'application/vnd.google-apps.folder') {
            const subFiles = await fetchAllFilesRecursively(item.id);
            fileList = fileList.concat(subFiles);
          } else {
            fileList.push(item);
          }
        }
      } catch (err) {
        console.error('Fetch error:', err);
      }
      return fileList;
    }

    async function searchWithGemini(userQuery, files, apiKey) {
      const fileSummaries = files.map(f => `- ID: ${f.id}, 名前: ${f.name}`).join('\n');

      const prompt = `以下のファイル一覧の中から、ユーザーの検索「${userQuery}」に最も関連するファイルを選び、そのIDのみをカンマ区切りで返してください（例: id1,id2）。該当なしは NONE と返してください。

【ファイル一覧】
${fileSummaries}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const replyText = data.candidates[0].content.parts[0].text.trim();

        if (replyText.includes('NONE')) return [];

        const matchedIds = replyText.split(',').map(s => s.trim());
        return files.filter(f => matchedIds.includes(f.id));
      } catch (err) {
        console.error('Gemini error:', err);
        return files.filter(f => f.name.includes(userQuery));
      }
    }

    function renderSearchResults(items, keyword) {
      const container = document.getElementById('tournament-container');
      const existingSearchCol = document.getElementById('round-search');
      if (existingSearchCol) existingSearchCol.remove();

      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = 'round-search';

      const header = document.createElement('div');
      header.style.fontSize = '12px';
      header.style.fontWeight = 'bold';
      header.style.color = '#7c3aed';
      header.innerText = `🔍 検索結果: 「${keyword}」 (${items.length}件)`;
      column.appendChild(header);

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <img src="image/file.png" class="icon-img" alt="icon" />
          <span class="title" title="${item.name}">${item.name}</span>
        `;
        card.addEventListener('click', () => {
          highlightSelection(card);
          clearRoundsFrom(1);
          renderPreviewColumn(item, 1);
          drawConnectors();
        });
        column.appendChild(card);
      });

      container.appendChild(column);
      column.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function highlightSelection(element) {
      const parentColumn = element.parentElement;
      Array.from(parentColumn.children).forEach(child => child.classList.remove('selected'));
      element.classList.add('selected');
    }

    function clearRoundsFrom(roundIndex) {
      const container = document.getElementById('tournament-container');
      let i = roundIndex;
      while (document.getElementById(`round-${i}`)) {
        container.removeChild(document.getElementById(`round-${i}`));
        i++;
      }
      const searchCol = document.getElementById('round-search');
      if (searchCol) searchCol.remove();
      drawConnectors();
    }

    window.addEventListener('resize', drawConnectors);
  </script>
</body>
</html>
