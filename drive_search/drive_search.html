<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Soft Tournament Drive Map</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #e8eef5 100%);
      color: #4a5568;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ヘッダー & 検索コントロール */
    header {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      z-index: 100;
      gap: 15px;
      flex-wrap: wrap;
    }
    h1 { font-size: 18px; margin: 0; color: #2d3748; font-weight: 600; white-space: nowrap; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
    }
    .search-bar input, .search-bar select {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      color: #334155;
    }
    .search-bar input[type="text"] { width: 200px; }

    /* ボタン */
    .btn {
      padding: 8px 18px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(124, 58, 237, 0.3); }

    /* 全体表示コンテナ */
    #workspace {
      position: relative;
      flex: 1;
      display: flex;
      overflow: auto;
    }

    /* SVG接続線描画用キャンバス */
    #connector-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* トーナメント表示エリア */
    #tournament-container {
      position: relative;
      z-index: 2;
      display: flex;
      padding: 40px;
      align-items: center;
      gap: 80px; /* カラム間隔 */
      min-height: 100%;
    }

    /* ラウンド（階層）カラム */
    .round-column {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 220px;
      gap: 20px;
    }

    /* トーナメントカード（ノード） */
    .node-card {
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(149, 157, 165, 0.08);
      border: 2px solid #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .node-card:hover {
      transform: scale(1.02);
      border-color: #64748b;
    }
    .node-card.selected {
      background: #ffffff;
      border-color: #0f172a; /* 選択時は黒い太枠 */
      border-width: 2px;
      color: #0f172a;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
    }

    .icon-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .node-card.drive-a { border-left: 6px solid #f472b6; }
    .node-card.drive-b { border-left: 6px solid #38bdf8; }
    .node-card.drive-c { border-left: 6px solid #34d399; }

    .title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    /* SVG分岐線の基本スタイル（薄いグレー） */
    .line-default {
      fill: none;
      stroke: #cbd5e1; /* 薄いグレー */
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    /* 選択ルートの線（黒） */
    .line-active {
      stroke: #0f172a !important; /* 黒 */
      stroke-width: 2.5 !important;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header>
    <h1>🌸 Soft Drive Tournament</h1>

    <!-- 検索バー -->
    <div class="search-bar">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="名前・本文・説明欄を検索..." />
      <select id="date-filter">
        <option value="all">全期間</option>
        <option value="7">過去1週間</option>
        <option value="30">過去1ヶ月</option>
        <option value="365">過去1年</option>
      </select>
      <button class="btn" style="padding: 4px 12px; font-size: 12px;" onclick="executeSearch()">検索</button>
    </div>

    <div>
      <button id="login-btn" class="btn">Googleでログイン</button>
      <span id="status" style="margin-left: 10px; font-size: 12px; color: #718096;"></span>
    </div>
  </header>

  <div id="workspace">
    <!-- トーナメント分岐線を描画するSVGキャンバス -->
    <svg id="connector-svg"></svg>

    <div id="tournament-container">
    <!-- 第1ラウンド: 3つの共有フォルダ/ドライブ -->
    <div class="round-column" id="round-0">
      <div class="node-card drive-a" onclick="selectDrive('0AFuy2E2OGEvyUk9PVA', '共有ドライブ A', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">本部管理</span>
      </div>
      <div class="node-card drive-b" onclick="selectDrive('0ALkBF3CxaFy_Uk9PVA', '共有ドライブ B', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">法人クライアント</span>
      </div>
      <div class="node-card drive-c" onclick="selectDrive('0ACErmC2osz2KUk9PVA', '共有ドライブ C', this)">
        <img src="image/folder.png" class="icon-img" alt="folder" />
        <span class="title">個人クライアント</span>
      </div>
    </div>

    <!-- ここに階層（第2ラウンド、第3ラウンド...）が動的に追加されます -->
  </div>
<script>
    const CLIENT_ID = '554521661384-kpp41s620jutab56eu2qi0b7bcbrfgl6.apps.googleusercontent.com';
    let accessToken = null;
    let selectedPath = []; // 選択したカードの配列

    document.getElementById('login-btn').addEventListener('click', () => {
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.metadata.readonly',
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('status').innerText = '準備完了！ドライブを選択してください';
          }
        },
      });
      tokenClient.requestAccessToken();
    });

    // ドライブ選択
    async function selectDrive(driveId, name, element) {
      if (!accessToken) { alert('ログインしてください'); return; }
      selectedPath = [element];
      highlightSelection(element);
      await loadChildNodes(driveId, 1);
    }

    // 子要素読み込み
    async function loadChildNodes(parentId, roundIndex) {
      document.getElementById('status').innerText = '解析中...';
      clearRoundsFrom(roundIndex);

      try {
        const query = `'${parentId}' in parents and trashed = false`;
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,mimeType,description,modifiedTime,webViewLink)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=50`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const items = data.files || [];

        renderNextRound(items, roundIndex);
        document.getElementById('status').innerText = `解析完了 (${items.length} 件)`;
        
        setTimeout(drawConnectors, 50);
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'エラーが発生しました';
      }
    }

    // 次のラウンド描画
    function renderNextRound(items, roundIndex) {
      const container = document.getElementById('tournament-container');
      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = `round-${roundIndex}`;

      if (items.length === 0) {
        column.innerHTML = '<div style="font-size:12px; color:#a0aec0;">(空です)</div>';
      } else {
        items.forEach(item => {
          const isFolder = item.mimeType === 'application/vnd.google-apps.folder';
          const card = document.createElement('div');
          card.className = 'node-card';
          card.dataset.id = item.id;
          
          const iconSrc = isFolder ? 'image/folder.png' : 'image/file.png';
          card.innerHTML = `
            <img src="${iconSrc}" class="icon-img" alt="icon" />
            <span class="title" title="${item.name}">${item.name}</span>
          `;

          card.addEventListener('click', () => {
            selectedPath = selectedPath.slice(0, roundIndex);
            selectedPath.push(card);

            highlightSelection(card);
            if (isFolder) {
              loadChildNodes(item.id, roundIndex + 1);
            } else {
              clearRoundsFrom(roundIndex + 1);
              drawConnectors();
              window.open(item.webViewLink, '_blank');
            }
          });

          column.appendChild(card);
        });
      }

      container.appendChild(column);
    }

    // 【★新機能】スケッチどおりのトーナメント（樹形図）分岐線を描画する関数
    function drawConnectors() {
      const svg = document.getElementById('connector-svg');
      const workspace = document.getElementById('workspace');
      svg.innerHTML = '';

      svg.setAttribute('width', workspace.scrollWidth);
      svg.setAttribute('height', workspace.scrollHeight);

      for (let i = 0; i < selectedPath.length; i++) {
        const parentCard = selectedPath[i];
        const nextRoundCol = document.getElementById(`round-${i + 1}`);
        if (!parentCard || !nextRoundCol) continue;

        const pRect = parentCard.getBoundingClientRect();
        const wRect = workspace.getBoundingClientRect();

        // 1. 親カードの「右端中央」の座標
        const startX = pRect.right - wRect.left + workspace.scrollLeft;
        const startY = pRect.top + pRect.height / 2 - wRect.top + workspace.scrollTop;

        const childCards = Array.from(nextRoundCol.querySelectorAll('.node-card'));
        if (childCards.length === 0) continue;

        // 子要素全体のY座標の範囲を取得
        const childYs = childCards.map(c => {
          const cr = c.getBoundingClientRect();
          return cr.top + cr.height / 2 - wRect.top + workspace.scrollTop;
        });

        const minChildY = Math.min(...childYs);
        const maxChildY = Math.max(...childYs);

        // 分岐の縦線（幹）を配置するX座標（親と子のちょうど真ん中）
        const firstChildRect = childCards[0].getBoundingClientRect();
        const firstChildX = firstChildRect.left - wRect.left + workspace.scrollLeft;
        const midX = startX + (firstChildX - startX) / 2;

        const isNextSelected = selectedPath[i + 1];

        // --- A. 親から縦幹までの「横線」 ---
        const parentLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        parentLine.setAttribute('x1', startX);
        parentLine.setAttribute('y1', startY);
        parentLine.setAttribute('x2', midX);
        parentLine.setAttribute('y2', startY);
        // 次の階層で何か選択されていれば黒、まだならグレー
        parentLine.setAttribute('class', `line-default ${isNextSelected ? 'line-active' : ''}`);
        svg.appendChild(parentLine);

        // --- B. 縦の「幹」線 ---
        const verticalLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        verticalLine.setAttribute('x1', midX);
        verticalLine.setAttribute('y1', minChildY);
        verticalLine.setAttribute('x2', midX);
        verticalLine.setAttribute('y2', maxChildY);
        verticalLine.setAttribute('class', 'line-default');
        svg.appendChild(verticalLine);

        // --- C. 幹から各子ノードへの「横線」 ---
        childCards.forEach(child => {
          const cRect = child.getBoundingClientRect();
          const childX = cRect.left - wRect.left + workspace.scrollLeft;
          const childY = cRect.top + cRect.height / 2 - wRect.top + workspace.scrollTop;

          const childLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          childLine.setAttribute('x1', midX);
          childLine.setAttribute('y1', childY);
          childLine.setAttribute('x2', childX);
          childLine.setAttribute('y2', childY);

          // この子が選択されているアイテムなら「黒」でハイライト
          const isThisChildSelected = (selectedPath[i + 1] === child);
          childLine.setAttribute('class', `line-default ${isThisChildSelected ? 'line-active' : ''}`);

          svg.appendChild(childLine);

          // もしこの子が選択中なら、縦幹の一部（親のYからこの子のYまで）も黒く塗る
          if (isThisChildSelected) {
            const activeVert = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            activeVert.setAttribute('x1', midX);
            activeVert.setAttribute('y1', startY);
            activeVert.setAttribute('x2', midX);
            activeVert.setAttribute('y2', childY);
            activeVert.setAttribute('class', 'line-default line-active');
            svg.appendChild(activeVert);
          }
        });
      }
    }

    // メタデータ対応 全体検索機能
    async function executeSearch() {
      const keyword = document.getElementById('search-input').value.trim();
      const days = document.getElementById('date-filter').value;

      if (!accessToken) { alert('Googleでログインしてください'); return; }
      if (!keyword && days === 'all') { alert('検索キーワードまたは期間を指定してください'); return; }

      document.getElementById('status').innerText = '検索中...';

      let queryParts = ["trashed = false"];
      if (keyword) {
        const escapedKeyword = keyword.replace(/['\\]/g, '\\$&');
        queryParts.push(`(name contains '${escapedKeyword}' or description contains '${escapedKeyword}' or fullText contains '${escapedKeyword}')`);
      }
      if (days !== 'all') {
        const date = new Date();
        date.setDate(date.getDate() - parseInt(days));
        queryParts.push(`modifiedTime > '${date.toISOString()}'`);
      }

      const q = queryParts.join(' and ');

      try {
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,mimeType,description,modifiedTime,parents,webViewLink)&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=30`,
          { headers: { Authorization: `Bearer ${accessToken}` } }
        );
        const data = await res.json();
        const results = data.files || [];

        if (results.length === 0) {
          alert('該当するファイルが見つかりませんでした');
          document.getElementById('status').innerText = '該当なし';
          return;
        }

        renderSearchResults(results, keyword);
        document.getElementById('status').innerText = `ヒット: ${results.length} 件`;
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = '検索エラーが発生しました';
      }
    }

    function renderSearchResults(items, keyword) {
      const container = document.getElementById('tournament-container');
      const existingSearchCol = document.getElementById('round-search');
      if (existingSearchCol) existingSearchCol.remove();

      const column = document.createElement('div');
      column.className = 'round-column';
      column.id = 'round-search';

      const header = document.createElement('div');
      header.style.fontSize = '12px';
      header.style.fontWeight = 'bold';
      header.style.color = '#0f172a';
      header.innerText = `🔍 「${keyword}」の検索結果 (${items.length}件)`;
      column.appendChild(header);

      items.forEach(item => {
        const isFolder = item.mimeType === 'application/vnd.google-apps.folder';
        const card = document.createElement('div');
        card.className = 'node-card';
        
        const iconSrc = isFolder ? 'image/folder.png' : 'image/file.png';
        const dateStr = item.modifiedTime ? new Date(item.modifiedTime).toLocaleDateString() : '';
        
        card.innerHTML = `
          <img src="${iconSrc}" class="icon-img" alt="icon" />
          <div style="display:flex; flex-direction:column; overflow:hidden;">
            <span class="title" title="${item.name}">${item.name}</span>
            <span style="font-size:10px; color:#94a3b8;">${dateStr}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          highlightSelection(card);
          if (isFolder) {
            loadChildNodes(item.id, 1);
          } else {
            window.open(item.webViewLink, '_blank');
          }
        });

        column.appendChild(card);
      });

      container.appendChild(column);
      column.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function highlightSelection(element) {
      const parentColumn = element.parentElement;
      Array.from(parentColumn.children).forEach(child => child.classList.remove('selected'));
      element.classList.add('selected');
    }

    function clearRoundsFrom(roundIndex) {
      const container = document.getElementById('tournament-container');
      let i = roundIndex;
      while (document.getElementById(`round-${i}`)) {
        container.removeChild(document.getElementById(`round-${i}`));
        i++;
      }
      drawConnectors();
    }

    window.addEventListener('resize', drawConnectors);
  </script>
</body>
</html>
