<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>取引の異常値・異常入力チェッカー - freee拡張ポータル</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .app-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .app-tag {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .date-range-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .date-field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .info-box {
      background: var(--primary-light);
      border: 1px solid rgba(37, 99, 235, 0.2);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      line-height: 1.6;
    }
    .loading-box {
      text-align: center;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .summary-stats {
      display: flex;
      gap: 20px;
    }
    .stat .num {
      font-size: 24px;
      font-weight: 700;
      display: block;
    }
    .stat .num.danger { color: var(--danger-text); }
    .stat .lbl {
      font-size: 12px;
      color: var(--text-muted);
    }
    .all-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .all-table th, .all-table td {
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .all-table th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-muted);
    }
    .all-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="page">
    <header>
      <div class="header-left">
        <img src="../images/360097.png" alt="D-Tax Logo" class="header-logo">
        <div class="header-title-area">
          <h1>異常値・異常入力チェッカー</h1>
          <p>対象事業所: <b id="currentCompanyLabel" style="color:var(--text-main);">読み込み中...</b></p>
        </div>
      </div>
      
      <div class="menu-container">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="メニューを開く" type="button">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item" id="logoutBtn" type="button"><span>🚪</span> ログアウト</button>
        </div>
      </div>
    </header>

    <div class="app-header-bar">
      <a href="../index.html" class="btn-nav">← ポータルへ戻る</a>
      <span class="app-tag">使用中：取引の異常値・異常入力チェッカー</span>
    </div>

    <div class="step-box">
      <div class="step-title">監査用チェックの実行</div>
      <div class="step-desc">過去の取引データから統計的に乖離している金額や、入力ミスが疑われる仕訳を検出します。</div>
      
      <div class="date-range-grid" style="margin-bottom: 16px;">
        <div class="date-field">
          <label>対象期間</label>
          <select class="form-select" id="auditMonthsSelect">
            <option value="1">当月分のみ</option>
            <option value="3" selected>過去 3ヶ月</option>
            <option value="6">過去 6ヶ月</option>
          </select>
        </div>
        <div class="date-field">
          <label>金額乖離トリガー</label>
          <select class="form-select" id="auditThresholdSelect">
            <option value="3">平均の 3倍以上</option>
            <option value="5" selected>平均の 5倍以上 (桁指定ミス等)</option>
            <option value="10">平均の 10倍以上</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" id="runAuditCheckBtn" type="button">異常値・入力ミスを抽出する</button>

      <div class="info-box">
        <b>【何を抽出するのか】</b><br>
        ・<b>金額の桁間違い</b>：平均値から大きく乖離した取引。<br>
        ・<b>税区分の矛盾</b>：いつもと異なる税区分になっている矛盾取引。
      </div>
    </div>

    <div id="auditLoadingSection" class="loading-box hidden">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: var(--text-main);">全仕訳・取引データを解析中...</div>
    </div>

    <div id="auditResultSection" class="hidden">
      <div class="summary">
        <div class="summary-stats">
          <div class="stat"><span class="num danger" id="statAuditTotalCount">0</span><span class="lbl">要確認の異常取引数</span></div>
        </div>
      </div>
      <div style="overflow-x: auto;">
        <table class="all-table">
          <thead>
            <tr><th>発生日 / 取引先</th><th>科目 / 登録金額</th><th>検知された異常理由</th><th>リスク度</th></tr>
          </thead>
          <tbody id="auditTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>
  
  <script>
    (function () {
      "use strict";
      // カーソル・演出処理
      const cursorDot = document.getElementById('cursorDot');
      const cursorGlow = document.getElementById('cursorGlow');
      let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        cursorDot.style.opacity = '1'; cursorGlow.style.opacity = '1';
        cursorDot.style.left = `${mouseX}px`; cursorDot.style.top = `${mouseY}px`;
      });
      function animateGlow() {
        glowX += (mouseX - glowX) * 0.15; glowY += (mouseY - glowY) * 0.15;
        cursorGlow.style.left = `${glowX}px`; cursorGlow.style.top = `${glowY}px`;
        requestAnimationFrame(animateGlow);
      }
      animateGlow();
      window.addEventListener('click', (e) => {
        const ripple = document.createElement('div');
        ripple.className = 'ripple-wave';
        ripple.style.left = `${e.clientX}px`; ripple.style.top = `${e.clientY}px`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 800);
      });

      // ハンバーガーメニュー
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const dropdownMenu = document.getElementById('dropdownMenu');
      const logoutBtn = document.getElementById('logoutBtn');
      hamburgerBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
      window.addEventListener('click', () => dropdownMenu.classList.remove('show'));
      dropdownMenu.addEventListener('click', (e) => e.stopPropagation());
      logoutBtn.addEventListener('click', () => {
        if (confirm('ログアウトしますか？')) { sessionStorage.clear(); window.location.href = '../index.html'; }
      });

      // アプリ固有ロジック
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      if (!token || !companyId) { window.location.href = '../index.html'; return; }
      document.getElementById('currentCompanyLabel').textContent = sessionStorage.getItem('company_name');

      document.getElementById('runAuditCheckBtn').addEventListener('click', async () => {
        const thresholdMultiplier = parseFloat(document.getElementById('auditThresholdSelect').value) || 5;

        const btn = document.getElementById('runAuditCheckBtn');
        const loading = document.getElementById('auditLoadingSection');
        const result = document.getElementById('auditResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          const res = await fetch(`https://api.freee.co.jp/api/1/deals?company_id=${companyId}&limit=100`, {
            headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
          });
          if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
          const data = await res.json();
          const deals = data.deals || [];

          const accountStats = {};
          deals.forEach(d => {
            d.details.forEach(det => {
              const accName = det.account_item_name || 'その他';
              if (!accountStats[accName]) accountStats[accName] = { total: 0, count: 0 };
              accountStats[accName].total += det.amount;
              accountStats[accName].count += 1;
            });
          });

          const averages = {};
          Object.keys(accountStats).forEach(acc => {
            averages[acc] = accountStats[acc].total / accountStats[acc].count;
          });

          const anomalies = [];
          deals.forEach(d => {
            d.details.forEach(det => {
              const accName = det.account_item_name || 'その他';
              const avg = averages[accName] || 0;
              if (avg > 0 && det.amount >= avg * thresholdMultiplier) {
                anomalies.push({
                  date: d.issue_date,
                  partner: d.partner_name || '取引先未設定',
                  account: accName,
                  amount: det.amount,
                  avg: Math.round(avg),
                  multiple: (det.amount / avg).toFixed(1)
                });
              }
            });
          });

          const tbody = document.getElementById('auditTableBody');
          tbody.innerHTML = '';
          if (anomalies.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">異常値が疑われる取引は検出されませんでした。</td></tr>';
          } else {
            anomalies.forEach(row => {
              tbody.innerHTML += `<tr><td>${row.date}<br><b>${row.partner}</b></td><td>${row.account}<br><b style="color:var(--text-main);">¥ ${row.amount.toLocaleString()}</b></td><td style="color:var(--danger-text); font-weight:600; font-size:12px;">平均(約¥${row.avg.toLocaleString()})の ${row.multiple}倍の金額乖離</td><td><span style="font-size:11px; background:var(--danger-bg); color:var(--danger-text); padding:2px 6px; border-radius:4px; font-weight:bold; border: 1px solid var(--danger-border);">高（要確認）</span></td></tr>`;
            });
          }

          document.getElementById('statAuditTotalCount').textContent = anomalies.length + ' 件';
          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
