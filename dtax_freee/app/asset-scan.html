<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定資産スキャン - freee拡張ポータル</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .app-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .app-tag {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .info-box {
      background: var(--primary-light);
      border: 1px solid rgba(37, 99, 235, 0.2);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 16px;
      line-height: 1.6;
    }
    .loading-box {
      text-align: center;
      padding: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .summary-stats {
      display: flex;
      gap: 20px;
    }
    .stat .num {
      font-size: 24px;
      font-weight: 700;
      display: block;
    }
    .stat .num.danger { color: var(--danger-text); }
    .stat .lbl {
      font-size: 12px;
      color: var(--text-muted);
    }
    .all-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .all-table th, .all-table td {
      padding: 12px 16px;
      text-align: left;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .all-table th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-muted);
    }
    .all-table tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="page">
    <header>
      <div class="header-left">
        <img src="../images/360097.png" alt="D-Tax Logo" class="header-logo">
        <div class="header-title-area">
          <h1>固定資産スキャン</h1>
          <p>対象事業所: <b id="currentCompanyLabel" style="color:var(--text-main);">読み込み中...</b></p>
        </div>
      </div>
      
      <div class="menu-container">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="メニューを開く" type="button">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item" id="logoutBtn" type="button"><span>🚪</span> ログアウト</button>
        </div>
      </div>
    </header>

    <div class="app-header-bar">
      <a href="../index.html" class="btn-nav">← ポータルへ戻る</a>
      <span class="app-tag">使用中：固定資産スキャン</span>
    </div>

    <div class="step-box">
      <div class="step-title">固定資産・減価償却のモレチェック</div>
      <div class="step-desc">10万円以上の購入費用で「消耗品費」として処理されているものや、固定資産台帳への登録漏れ候補を抽出します。</div>
      <button class="btn-primary" id="runAssetScanBtn" type="button">高額消耗品・資産候補をスキャンする</button>
      
      <div class="info-box">
        <b>【何を抽出するのか】</b><br>
        10万円以上の購入費用で「消耗品費」や「工具器具備品」として処理されているデータを検出します。
      </div>
    </div>

    <div id="assetLoadingSection" class="loading-box hidden">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: var(--text-main);">仕訳データをスキャン中...</div>
    </div>

    <div id="assetResultSection" class="hidden">
      <div class="summary">
        <div class="summary-stats">
          <div class="stat"><span class="num danger" id="statAssetCount">0</span><span class="lbl">要確認の資産候補数</span></div>
        </div>
      </div>
      <div style="overflow-x: auto;">
        <table class="all-table">
          <thead>
            <tr><th>発生日</th><th>取引先 / 内容</th><th>金額</th><th>判定理由</th></tr>
          </thead>
          <tbody id="assetTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <script>
    (function () {
      "use strict";
      // カーソル・演出処理
      const cursorDot = document.getElementById('cursorDot');
      const cursorGlow = document.getElementById('cursorGlow');
      let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        cursorDot.style.opacity = '1'; cursorGlow.style.opacity = '1';
        cursorDot.style.left = `${mouseX}px`; cursorDot.style.top = `${mouseY}px`;
      });
      function animateGlow() {
        glowX += (mouseX - glowX) * 0.15; glowY += (mouseY - glowY) * 0.15;
        cursorGlow.style.left = `${glowX}px`; cursorGlow.style.top = `${glowY}px`;
        requestAnimationFrame(animateGlow);
      }
      animateGlow();
      window.addEventListener('click', (e) => {
        const ripple = document.createElement('div');
        ripple.className = 'ripple-wave';
        ripple.style.left = `${e.clientX}px`; ripple.style.top = `${e.clientY}px`;
        document.body.appendChild(ripple);
        setTimeout(() => ripple.remove(), 800);
      });

      // ハンバーガーメニュー
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const dropdownMenu = document.getElementById('dropdownMenu');
      const logoutBtn = document.getElementById('logoutBtn');
      hamburgerBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('show'); });
      window.addEventListener('click', () => dropdownMenu.classList.remove('show'));
      dropdownMenu.addEventListener('click', (e) => e.stopPropagation());
      logoutBtn.addEventListener('click', () => {
        if (confirm('ログアウトしますか？')) { sessionStorage.clear(); window.location.href = '../index.html'; }
      });

      // アプリ固有ロジック
      const token = sessionStorage.getItem('access_token');
      const companyId = sessionStorage.getItem('company_id');
      if (!token || !companyId) { window.location.href = '../index.html'; return; }
      document.getElementById('currentCompanyLabel').textContent = sessionStorage.getItem('company_name');

      document.getElementById('runAssetScanBtn').addEventListener('click', async () => {
        const btn = document.getElementById('runAssetScanBtn');
        const loading = document.getElementById('assetLoadingSection');
        const result = document.getElementById('assetResultSection');
        result.classList.add('hidden');
        loading.classList.remove('hidden');
        btn.disabled = true;

        try {
          const res = await fetch(`https://api.freee.co.jp/api/1/deals?company_id=${companyId}&limit=100`, {
            headers: { 'Authorization': `Bearer ${token}`, 'accept': 'application/json' }
          });
          if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
          const data = await res.json();
          const deals = data.deals || [];

          const assetCandidates = [];
          deals.forEach(d => {
            d.details.forEach(det => {
              const accName = det.account_item_name || '';
              if ((accName.includes('消耗品') || accName.includes('工具器具備品')) && det.amount >= 100000) {
                assetCandidates.push({
                  date: d.issue_date,
                  content: `${d.partner_name || '取引先不明'} (${accName})`,
                  amount: det.amount,
                  reason: `${accName}として処理されていますが 10万円以上です（固定資産・一括償却等の検討推奨）`
                });
              }
            });
          });

          const tbody = document.getElementById('assetTableBody');
          tbody.innerHTML = '';
          if (assetCandidates.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">高額な消耗品費等の資産候補は見つかりませんでした。</td></tr>';
          } else {
            assetCandidates.forEach(row => {
              tbody.innerHTML += `<tr><td>${row.date}</td><td><b>${row.content}</b></td><td>¥ ${row.amount.toLocaleString()}</td><td style="color:var(--danger-text);">${row.reason}</td></tr>`;
            });
          }

          document.getElementById('statAssetCount').textContent = assetCandidates.length + ' 件';
          loading.classList.add('hidden');
          result.classList.remove('hidden');
        } catch (err) {
          alert('データ取得に失敗しました: ' + err.message);
          loading.classList.add('hidden');
        } finally {
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
