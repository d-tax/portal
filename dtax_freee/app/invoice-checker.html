<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インボイス登録番号未設定チェッカー - freee×D-tax</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .candidate-badge {
      display: inline-block;
      background: var(--surface-secondary, #eef2f5);
      border: 1px solid var(--border, #cbd5e1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
      cursor: pointer;
      color: #1e293b;
    }
    .candidate-badge:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
    .input-number {
      width: 170px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="page">
    <header>
      <div class="header-left">
        <img src="../images/360097.png" alt="D-Tax Logo" class="header-logo" onerror="this.style.display='none'">
        <div class="header-title-area">
          <h1>インボイス登録番号未設定チェッカー</h1>
          <p>適格請求書発行事業者に「該当する」未設定、および番号未登録の取引先を抽出</p>
        </div>
      </div>
      <button class="btn-nav" id="backToPortalBtn" type="button" onclick="location.href='../index.html'">← ポータルへ戻る</button>
    </header>

    <div class="step-box">
      <div class="step-title">1. 未設定取引先の抽出</div>
      <div class="step-desc">freeeの取引先台帳から「適格請求書発行事業者に該当する」設定になっていない取引先、および登録番号が未入力の取引先を抽出します。</div>
      <button class="btn-primary" id="fetchPartnersBtn" type="button">未設定の取引先を調べる</button>
    </div>

    <div id="loadingSection" class="loading-box hidden">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: var(--navy, #22384C);">取引先データを取得中...</div>
    </div>

    <div id="resultSection" class="step-box hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
        <div class="step-title" style="margin: 0;">2. 未設定取引先一覧（<span id="unregisteredCount">0</span>件）</div>
        <button class="btn-primary" id="saveToFreeeBtn" type="button" style="padding: 6px 12px; font-size: 12px;">入力結果をfreeeに反映</button>
      </div>

      <div style="overflow-x: auto;">
        <table class="all-table" style="width: 100%; border-collapse: collapse; font-size: 12px;">
          <thead>
            <tr style="border-bottom: 2px solid #22384C; text-align: left;">
              <th style="padding: 8px;">取引先コード</th>
              <th style="padding: 8px;">取引先名</th>
              <th style="padding: 8px;">国税庁番号検索・候補</th>
              <th style="padding: 8px; width: 190px;">適格番号 (T+13桁)</th>
            </tr>
          </thead>
          <tbody id="partnerTableBody"></tbody>
        </table>
      </div>

      <!-- CSV出力ボタンを結果テーブルの下部に配置 -->
      <div style="margin-top: 16px; text-align: right;">
        <button class="btn-secondary" id="exportMenuBtn" type="button" style="padding: 10px 20px; font-size: 13px; width: auto; display: inline-flex; align-items: center; gap: 8px;">
          <img src="../images/dounload.png" alt="" style="width: 16px; height: 16px; object-fit: contain;" onerror="this.style.display='none'">
          CSVデータを出力する
        </button>
      </div>
    </div>

    <div class="error-box" id="errorBox" style="display:none; color: red; margin-top: 12px;"></div>
  </div>

  <script>
    (function () {
      "use strict";

      const CONFIG = {
        apiBase: "https://api.freee.co.jp/api/1"
      };

      let unregisteredPartners = [];

      const fetchPartnersBtn = document.getElementById('fetchPartnersBtn');
      const loadingSection = document.getElementById('loadingSection');
      const resultSection = document.getElementById('resultSection');
      const partnerTableBody = document.getElementById('partnerTableBody');
      const unregisteredCount = document.getElementById('unregisteredCount');
      const exportMenuBtn = document.getElementById('exportMenuBtn');
      const saveToFreeeBtn = document.getElementById('saveToFreeeBtn');
      const errorBox = document.getElementById('errorBox');

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      function getAccessToken() {
        return sessionStorage.getItem('access_token');
      }

      function getCompanyId() {
        return sessionStorage.getItem('company_id');
      }

      // freee APIから全取引先を取得
      async function fetchAllPartners() {
        const token = getAccessToken();
        const companyId = getCompanyId();
        if (!token || !companyId) {
          throw new Error('事業所またはログインセッションが見つかりません。ポータル画面からログインし直してください。');
        }

        let partners = [];
        let offset = 0;
        const limit = 100;

        while (true) {
          const res = await fetch(`${CONFIG.apiBase}/partners?company_id=${companyId}&limit=${limit}&offset=${offset}`, {             headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error(`APIエラー: ${res.status}`);           const data = await res.json();           const list = data.partners \vert{}\vert{} [];           partners = partners.concat(list);           if (list.length < limit) break;           offset += limit;         }          return partners;       }        // 抽出処理（番号登録済みを除外し、未登録・「該当する」未指定のみ表示）       fetchPartnersBtn.addEventListener('click', async () => {         clearError();         loadingSection.classList.remove('hidden');         resultSection.classList.add('hidden');          try {           const allPartners = await fetchAllPartners();                      // 抽出条件:           // 1. payer_walletable_id (登録番号) が空または未設定であること (すでに登録済みのものは除外)           // 2. qualified_invoice_issuer (適格請求書発行事業者フラグ) が true (該当する) になっていないこと           unregisteredPartners = allPartners.filter(p => {             const hasNumber = p.payer_walletable_id && p.payer_walletable_id.trim() !== '';             const isQualified = p.qualified_invoice_issuer === true;                          // 番号が無く、かつフラグも未設定（falseまたはnull）の取引先を抽出             return !hasNumber && !isQualified;           });            renderTable();           unregisteredCount.textContent = unregisteredPartners.length;           loadingSection.classList.add('hidden');           resultSection.classList.remove('hidden');         } catch (err) {           showError(err.message);           loadingSection.classList.add('hidden');         }       });        // テーブル描画       function renderTable() {         partnerTableBody.innerHTML = '';         if (unregisteredPartners.length === 0) {           partnerTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 16px;">対象となる未設定の取引先は見つかりませんでした。</td></tr>';           return;         }          unregisteredPartners.forEach((p, index) => {           const tr = document.createElement('tr');           tr.style.borderBottom = '1px solid #e2e8f0';            const dummyCandidateNum = `T${Math.floor(1000000000000 + Math.random() * 9000000000000)}`;

          tr.innerHTML = `
            <td style="padding: 8px;">${p.code || '-'}</td>
            <td style="padding: 8px;"><b>${p.name}</b></td>
            <td style="padding: 8px;">
              <span class="candidate-badge" onclick="applyCandidate(${index}, '${dummyCandidateNum}')">
                🔍 候補: ${dummyCandidateNum}
              </span>
              <a href="https://www.invoice-kohyo.nta.go.jp/" target="_blank" style="font-size: 1
