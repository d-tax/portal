<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インボイス登録番号未設定チェッカー - freee×D-tax</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .candidate-badge {
      display: inline-block;
      background: #eef2f5;
      border: 1px solid #cbd5e1;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-right: 4px;
      cursor: pointer;
      color: #1e293b;
      font-weight: 600;
    }
    .candidate-badge:hover {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1d4ed8;
    }
    .input-number {
      width: 170px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
    }
    .searching-text {
      font-size: 11px;
      color: #64748b;
    }
    .no-candidate {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="page">
    <header>
      <div class="header-left">
        <img src="../images/360097.png" alt="D-Tax Logo" class="header-logo" onerror="this.style.display='none'">
        <div class="header-title-area">
          <h1>インボイス登録番号未設定チェッカー</h1>
          <p>適格請求書発行事業者に「該当する」未設定、および番号未登録の取引先を抽出</p>
        </div>
      </div>
      <button class="btn-nav" id="backToPortalBtn" type="button" onclick="location.href='../dtax_freee.html'">← ポータルへ戻る</button>
    </header>

    <div class="step-box">
      <div class="step-title">1. 未設定取引先の抽出</div>
      <div class="step-desc">freeeの取引先台帳から「適格請求書発行事業者に該当する」設定になっていない取引先、および登録番号が未入力の取引先を抽出します。</div>
      <button class="btn-primary" id="fetchPartnersBtn" type="button">未設定の取引先を調べる</button>
    </div>

    <div id="loadingSection" class="loading-box hidden">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: var(--navy, #22384C);">取引先データを取得中...</div>
    </div>

    <div id="resultSection" class="step-box hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
        <div class="step-title" style="margin: 0;">2. 未設定取引先一覧（<span id="unregisteredCount">0</span>件）</div>
        <button class="btn-primary" id="saveToFreeeBtn" type="button" style="padding: 6px 12px; font-size: 12px;">入力結果をfreeeに反映</button>
      </div>

      <div style="overflow-x: auto;">
        <table class="all-table" style="width: 100%; border-collapse: collapse; font-size: 12px;">
          <thead>
            <tr style="border-bottom: 2px solid #22384C; text-align: left;">
              <th style="padding: 8px;">取引先コード</th>
              <th style="padding: 8px;">取引先名</th>
              <th style="padding: 8px;">Gemini 検索・登録番号候補</th>
              <th style="padding: 8px; width: 190px;">適格番号 (T+13桁)</th>
            </tr>
          </thead>
          <tbody id="partnerTableBody"></tbody>
        </table>
      </div>

      <div style="margin-top: 16px; text-align: right;">
        <button class="btn-secondary" id="exportMenuBtn" type="button" style="padding: 10px 20px; font-size: 13px; width: auto; display: inline-flex; align-items: center; gap: 8px;">
          <img src="../images/dounload.png" alt="" style="width: 16px; height: 16px; object-fit: contain;" onerror="this.style.display='none'">
          CSVデータを出力する
        </button>
      </div>
    </div>

    <div class="error-box" id="errorBox" style="display:none; color: red; margin-top: 12px;"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // ----------------------------------------------------
      // ★ 設定情報
      // ----------------------------------------------------
      const CONFIG = {
        apiBase: "https://api.freee.co.jp/api/1"
      };

      // ★ ご自身の Gemini API Key をここに直接記入してください
      const GEMINI_API_KEY = "AQ.Ab8RN6JZMu5ZQa5PxTDq-cE3l64OZhx2-lptnkCD_4uxXvfYLw";
      // ----------------------------------------------------

      let unregisteredPartners = [];

      const fetchPartnersBtn = document.getElementById('fetchPartnersBtn');
      const loadingSection = document.getElementById('loadingSection');
      const resultSection = document.getElementById('resultSection');
      const partnerTableBody = document.getElementById('partnerTableBody');
      const unregisteredCount = document.getElementById('unregisteredCount');
      const exportMenuBtn = document.getElementById('exportMenuBtn');
      const saveToFreeeBtn = document.getElementById('saveToFreeeBtn');
      const errorBox = document.getElementById('errorBox');

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      function getAccessToken() {
        return sessionStorage.getItem('access_token');
      }

      function getCompanyId() {
        return sessionStorage.getItem('company_id');
      }

      async function fetchAllPartners() {
        const token = getAccessToken();
        const companyId = getCompanyId();
        if (!token || !companyId) {
          throw new Error('事業所またはログインセッションが見つかりません。ポータル画面からログインし直してください。');
        }

        let partners = [];
        let offset = 0;
        const limit = 100;

        while (true) {
          const res = await fetch(`${CONFIG.apiBase}/partners?company_id=${companyId}&limit=${limit}&offset=${offset}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error(`APIエラー: ${res.status}`);
          const data = await res.json();
          const list = data.partners || [];
          partners = partners.concat(list);
          if (list.length < limit) break;
          offset += limit;
        }

        return partners;
      }

      fetchPartnersBtn.addEventListener('click', async () => {
        clearError();
        loadingSection.classList.remove('hidden');
        resultSection.classList.add('hidden');

        try {
          const allPartners = await fetchAllPartners();
          
          unregisteredPartners = allPartners.filter(p => {
            const hasNumber = p.payer_walletable_id && p.payer_walletable_id.trim() !== '';
            const isQualified = p.qualified_invoice_issuer === true;
            return !hasNumber && !isQualified;
          });

          renderTable();
          unregisteredCount.textContent = unregisteredPartners.length;
          loadingSection.classList.add('hidden');
          resultSection.classList.remove('hidden');
        } catch (err) {
          showError(err.message);
          loadingSection.classList.add('hidden');
        }
      });

      function renderTable() {
        partnerTableBody.innerHTML = '';
        if (unregisteredPartners.length === 0) {
          partnerTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 16px;">対象となる未設定の取引先は見つかりませんでした。</td></tr>';
          return;
        }

        const isKeyConfigured = GEMINI_API_KEY && GEMINI_API_KEY !== "YOUR_GEMINI_API_KEY_HERE";

        unregisteredPartners.forEach((p, index) => {
          const tr = document.createElement('tr');
          tr.style.borderBottom = '1px solid #e2e8f0';

          tr.innerHTML = `
            <td style="padding: 8px;">${p.code || '-'}</td>
            <td style="padding: 8px;"><b>${p.name}</b></td>
            <td style="padding: 8px;" id="candidate_cell_${index}">
              <span class="searching-text">${isKeyConfigured ? '🤖 Gemini 検索中...' : '⚠️ API Key未設定'}</span>
            </td>
            <td style="padding: 8px;">
              <input type="text" id="input_num_${index}" class="input-number" placeholder="T1234567890123" value="${p.temp_number || ''}" onchange="updateTempNum(${index}, this.value)">
            </td>
          `;
          partnerTableBody.appendChild(tr);

          if (isKeyConfigured) {
            // Gemini API に Google 検索グラウンディングを投げてT番号を取得
            fetchCandidateDirectFromGemini(p, GEMINI_API_KEY).then(candidateNum => {
              const cell = document.getElementById(`candidate_cell_${index}`);
              if (!cell) return;

              if (candidateNum) {
                cell.innerHTML = `
                  <span class="candidate-badge" onclick="applyCandidate(${index}, '${candidateNum}')">
                    ✨ 候補: ${candidateNum} (適用)
                  </span>
                  <a href="https://www.invoice-kohyo.nta.go.jp/" target="_blank" style="font-size: 11px; color: #2563eb; text-decoration: underline;">国税庁Web</a>
                `;
              } else {
                cell.innerHTML = `
                  <span class="no-candidate">候補なし</span>
                  <a href="https://www.invoice-kohyo.nta.go.jp/" target="_blank" style="font-size: 11px; color: #2563eb; text-decoration: underline; margin-left: 6px;">手動検索</a>
                `;
              }
            });
          }
        });
      }

      // Gemini REST API (v1beta) を呼び出す処理
      async function fetchCandidateDirectFromGemini(partner, apiKey) {
        const addressStr = [partner.street_name1, partner.street_name2].filter(Boolean).join(' ');
        const searchTarget = addressStr ? `${partner.name}（所在地: ${addressStr}）` : partner.name;

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        const prompt = `
以下の企業・事業者について、Google検索を用いて「適格請求書発行事業者の登録番号（Tから始まる13桁の番号）」を特定してください。

対象企業: ${searchTarget}

【条件】
・検索結果から間違いなく該当企業の登録番号であると確認できた場合のみ、半角の「T13桁の数字」（例: T1234567890123）を出力してください。
・候補が複数あって特定できない場合や、番号が見つからない場合は「NONE」とだけ出力してください。
・余計な解説文は一切出力せず、登録番号（例: T1234567890123）または「NONE」のみを出力してください。
`;

        const requestBody = {
          contents: [{
            parts: [{ text: prompt }]
          }],
          tools: [{
            google_search: {} // Google 検索ツールを有効化
          }]
        };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
          });

          if (!res.ok) {
            console.error('Gemini API レスポンスエラー Status:', res.status);
            return null;
          }

          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const match = text.match(/T\d{13}/);

          return match ? match[0] : null;
        } catch (err) {
          console.error('Gemini Fetch エラー:', err);
          return null;
        }
      }

      window.applyCandidate = function (index, number) {
        unregisteredPartners[index].temp_number = number;
        const inputElem = document.getElementById(`input_num_${index}`);
        if (inputElem) inputElem.value = number;
      };

      window.updateTempNum = function (index, val) {
        unregisteredPartners[index].temp_number = val.trim();
      };

      exportMenuBtn.addEventListener('click', () => {
        if (unregisteredPartners.length === 0) {
          alert('出力対象のデータがありません。');
          return;
        }

        const csvRows = [
          ['取引先ID', '取引先コード', '取引先名', '適格請求書発行事業者番号']
        ];

        unregisteredPartners.forEach((p, idx) => {
          const numInput = document.getElementById(`input_num_${idx}`)?.value || p.temp_number || '';
          csvRows.push([
            p.id,
            `"${p.code || ''}"`,
            `"${p.name}"`,
            `"${numInput}"`
          ]);
        });

        const csvContent = '\uFEFF' + csvRows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `インボイス未設定取引先一覧_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      saveToFreeeBtn.addEventListener('click', async () => {
        const token = getAccessToken();
        const companyId = getCompanyId();
        
        const targets = [];
        unregisteredPartners.forEach((p, idx) => {
          const val = document.getElementById(`input_num_${idx}`)?.value.trim();
          if (val) {
            targets.push({ id: p.id, name: p.name, number: val });
          }
        });

        if (targets.length === 0) {
          alert('更新対象となる番号が入力されていません。');
          return;
        }

        const invalidTargets = targets.filter(t => !/^T\d{13}$/.test(t.number));
        if (invalidTargets.length > 0) {
          alert(`以下の取引先の登録番号フォーマットが正しくありません (T+13桁数字):\n` + invalidTargets.map(t => `- ${t.name}: ${t.number}`).join('\n'));
          return;
        }

        if (!confirm(`${targets.length} 件の取引先に適格番号を登録し、「適格請求書発行事業者」として反映しますか？`)) return;

        saveToFreeeBtn.disabled = true;
        clearError();

        try {
          for (const t of targets) {
            const res = await fetch(`${CONFIG.apiBase}/partners/${t.id}`, {
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                company_id: Number(companyId),
                payer_walletable_id: t.number,
                qualified_invoice_issuer: true
              })
            });
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(`[${t.name}] の更新に失敗しました: ${JSON.stringify(errData)}`);
            }
          }
          alert('登録番号の一括更新および「適格事業者」の設定が完了しました！');
          fetchPartnersBtn.click();
        } catch (err) {
          showError('更新エラー: ' + err.message);
        } finally {
          saveToFreeeBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
