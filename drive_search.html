<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D Google Drive Map</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d1117;
      color: #fff;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      background-color: #238636;
      color: white;
      border: none;
      border-radius: 6px;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
  </style>

  <!-- Google 認証 & 3DライブラリをCDN経由で読み込み -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>

  <div id="ui">
    <h2 style="margin-top:0;">3D Drive Visualizer</h2>
    <div id="auth-section">
      <p>Google Driveのファイル階層を3D表示します</p>
      <button id="login-btn">Googleでログイン</button>
    </div>
    <div id="status" style="margin-top: 10px; font-size: 14px;"></div>
  </div>

  <div id="3d-graph"></div>

  <script>
    // ★ Step 1で取得した CLIENT_ID をここに貼り付けてください
    const CLIENT_ID = 'YOUR_CLIENT_ID.apps.googleusercontent.com';

    let tokenClient;
    let accessToken = null;

    // ログインボタンのイベント設定
    document.getElementById('login-btn').addEventListener('click', () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.metadata.readonly',
        callback: async (response) => {
          if (response.access_token) {
            accessToken = response.access_token;
            document.getElementById('status').innerText = 'Driveデータを取得中...';
            await fetchDriveData();
          }
        },
      });
      tokenClient.requestAccessToken();
    });

    // Drive API からファイルリストを取得
    async function fetchDriveData() {
      try {
        const response = await fetch(
          'https://www.googleapis.com/drive/v3/files?fields=files(id,name,mimeType,parents,size,modifiedTime)&pageSize=100',
          {
            headers: { Authorization: `Bearer ${accessToken}` }
          }
        );
        const data = await response.json();
        const files = data.files || [];

        document.getElementById('status').innerText = `取得完了: ${files.length} 件のファイル`;
        render3DGraph(files);
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'データ取得に失敗しました';
      }
    }

    // 取得したデータを3Dグラフ化
    function render3DGraph(files) {
      // ノード (点) の作成
      const nodes = files.map(f => {
        const isFolder = f.mimeType === 'application/vnd.google-apps.folder';
        return {
          id: f.id,
          name: f.name,
          val: isFolder ? 15 : 5, // フォルダは大きく
          color: isFolder ? '#4285F4' : '#34A853' // フォルダ:青, ファイル:緑
        };
      });

      // リンク (線) の作成
      const links = [];
      files.forEach(f => {
        if (f.parents && f.parents.length > 0) {
          f.parents.forEach(parentId => {
            if (files.some(item => item.id === parentId)) {
              links.push({ source: parentId, target: f.id });
            }
          });
        }
      });

      // 3D Force Graph の描画
      const Graph = ForceGraph3D()
        (document.getElementById('3d-graph'))
        .graphData({ nodes, links })
        .nodeLabel('name')
        .nodeColor('color')
        .nodeVal('val')
        .linkDirectionalParticles(2)
        .linkDirectionalParticleSpeed(0.005);
    }
  </script>
</body>
</html>
